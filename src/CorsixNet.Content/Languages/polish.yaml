    introduction_texts:
      level17: Ostatnia rada - dbaj o Reputację - to ona przyciąga lub zniechęca do twojej placówki pacjentów z całej okolicy. Jeśli tylko uda ci się nie zabić zbyt wielu ludzi i będą oni w miarę zadowoleni, nie powinieneś mieć problemów z tym poziomem!//Teraz już musisz radzić sobie sam. Życzę powodzenia.
      level1: Witaj w swoim pierwszym szpitalu!//Aby rozpocząć działalność, postaw Biurko Recepcji, zbuduj Gabinet Lekarski i zatrudnij Recepcjonistkę oraz Lekarza. Następnie zaczekaj, aż pojawią się kolejne zadania. Dobrym pomysłem jest budowa Gabinetu Psychiatrycznego oraz zatrudnienie Lekarza Psychiatry. Apteka i Pielęgniarka są także niezbędne w leczeniu pacjentów. Zwróć uwagę na ciężkie przypadki Głowowzdęcia - Napowietrzalnia rozwiąże ten problem. Będziesz musiał wyleczyć 10 ludzi i upewnić się, że twoja reputacja nie spadnie poniżej 200.
      level9: Skoro już wzbogaciłeś konto Ministerstwa oraz ufundowałeś nową limuzynę samemu Ministrowi, możesz wracać do szpitala i nieść pomoc chorym i potrzebującym. Tutaj napotkasz wiele różnych trudności. Z dobrze wyszkolonym personelem i gabinetami, nie powinieneś się niczego obawiać. Twój szpital musi być wart 200,000 PLN, a na konto ma trafić 400,000 PLN. Ani grosza mniej, bo nie ukończysz poziomu.
      level2: Na tym obszarze jest dużo więcej rodzajów schorzeń. Urządź swój szpital tak, aby przyjął więcej pacjentów oraz zaplanuj budowę Działu Badawczego. Pamiętaj o utrzymywaniu czystości i postaraj się o możliwie najwyższą reputację - będziesz miał do czynienia z chorobami takimi jak Obwisły Język, więc potrzebujesz Przychodni Obrzynania. Możesz także zbudować Kardiograf, aby lepiej diagnozować nowe choroby. Oba te gabinety muszą zostać wynalezione zanim będziesz mógł je zbudować. Teraz możesz także kupić dodatkowy grunt, aby rozwinąć swój szpital - w tym celu użyj Mapy Miasta. Twój cel to reputacja na poziomie 300, stan konta 10000 PLN, i 40 wyleczonych osób.
      level7: Będziesz tu pod ścisłym nadzorem Ministerstwa Zdrowia, dopilnuj więc by twoje konto wykazywało duże zyski, a reputacja szybowała w górę. Nie stać nas na niepotrzebne zgony - nie służy to biznesowi. Upewnij się, że personel jest w dobrej formie i że masz wszystkie wymagane urządzenia. Wypracuj reputację 600 oraz 200,000 PLN na koncie.
      level5: To będzie szpital pełen życia, leczący wiele różnych dolegliwości. Twoi Lekarze dopiero skończyli studia, więc trzeba będzie wybudować salę szkoleniową, aby zdobyli niezbędne kwalifikacje. Masz tylko trzech Konsultantów szkolących twój personel. Dbaj więc o to, by byli zadowoleni. Zauważ także, że fundamenty szpitala znajdują się na uskoku tektonicznym San Android. Występuje tu duże ryzyko trzęsień ziemi. Trzęsienia mogą w znacznym stopniu uszkodzić urządzenia i zakłócić pracę szpitala. Aby odnieść sukces, dociągnij reputację do 400, zgromadź w banku okrągłe 50,000 PLN i wylecz 200 pacjentów.
      level4: Staraj się zadowolić swych pacjentów, obłsuguj ich najlepiej jak potrafisz, utrzymaj również liczbę zgonów na absolutnym minimum.Stawką jest twoja reputacja, więc dopilnuj żeby osiągnęła wysoki poziom. Nie martw się za bardzo o pieniądze - uzyskasz je wraz z rosnącą reputacją. Będziesz też mógł szkolić swoich Lekarzy, aby zwiększać ich umiejętności. Wyszkolony personel będzie lepiej zajmować się pacjentami, którzy wyglądają na ciężej chorych niż pozostali. Osiągnij reputację na poziomie ponad 500.
      level14: Jest jeszcze jedno wyzwanie - totalnie niespodziewany szpital niespodzianka. Jeżeli tutaj odniesiesz sukces, będziesz zwycięzcą wszech czasów. Tylko nie myśl, że to będzie bułka z masłem, ponieważ jest to najtrudniejsze zadanie jakiemu stawisz czoła. Powodzenia!
      level15: Tak wyglądają podstawowe mechanizmy działalności szpitala.//Twoi Lekarze będą potrzebować wszelkiej możliwej pomocy do diagnozowania niektórych pacjentów. Możesz im pomóc budując kolejne obiekty, takie jak Gabinet Badań Podstawowych.
      level8: Do ciebie należy zadanie urządzenia wydajnego i opłacalnego szpitala. Ludzie tutaj są dość zamożni, więc oskub ich z forsy jak tylko się da. Miło jest leczyć ludzi, ale pamiętaj, że tak naprawdę liczą się PIENIĄDZE. Wyczyść tych chorych ludzi z pieniędzy. Aby ukończyć ten poziom, zgromadź sumę 300,000 PLN.
      level13: 'Twoje niewiarygodne umiejętności w administrowaniu szpitala zwróciły uwagę Trzeciego Wydziału Tajnych Służb Specjalnych. Mają dla ciebie ekstra zadanie: w szpitalu zaatakowanym przez szczury potrzeba Terminatora. Musisz ustrzelić tyle szczurów, ile zdołasz, zanim Dozorcy uprzątną bałagan. Myślisz, że poradzisz sobie z zadaniem?'
      demo: Witaj w szpitalu demonstracyjnym!//Niestety wersja demo zawiera tylko ten poziom. Jednakże, jest to więcej niż wystarczająco, aby zając ci trochę czasu! Napotkasz tutaj rozmaite choroby, które będą wymagały różnych gabinetów do ich wyleczenia. Od czasu do czasu moga tu również wystąpić nagłe wypadki. Będziesz musiał równiez wynaleźć nowe pomieszczenia przy użyciu gabinetu badawczego. Twoim celem jest zarobienie 100,000 PLN, mieć szpital warty 70,000 PLN i reputację 700, przy czym musisz wyleczyć co najmniej 75% swoich pacjentów. Upewnij się, że Twoja reputacja nie spadnie poniżej 300 oraz, że nie zabijesz więcej niż 40% pacjentów, albo przegrasz.//Powodzenia!
      level16: Kiedy już przebadasz część pacjentów, będziesz musiał zbudować pomieszczenia lecznicze oraz przychodnie, aby ich leczyć - dobrze jest zacząć od budowy Apteki. Do wydawania leków w Aptece będzie potrzebna Pielęgniarka .
      level6: Użyj całej swojej wiedzy, aby gładko poprowadzić szpital, który przyniesie dobry zysk i poradzi sobie ze wszystkim, co przyniesie mu chore społeczeństwo. Powinieneś uważać na panujący tu klimat, gdyż sprzyja on rozwojowi bakterii i infekcji. Jeśli nie utrzymasz tego miejsca we wzorowej czystości, musisz się liczyć z wybuchem epidemii wśród pacjentów. Powinieneś zarobić 150,000 PLN a twój szpital osiągnąć wartość co najmniej 140,000 PLN.
      level12: Masz teraz do czynienia z matką wszystkich wyzwań. Zachwycone twoimi sukcesami Ministerstwo ma dla ciebie zadanie specjalne. Masz zbudować kolejny wspaniały szpital, zarobić bajeczną ilość kasy i zyskać gigantyczną reputację. Musisz także wykupić wszystkie możliwe grunty, wyleczyć wszystko (tak - wszystko) oraz zgarnąć wszystkie nagrody. I jak? Dasz radę?Zarób 650,000 PLN, wylecz 750 ludzi oraz osiągnij reputację 800, aby wygrać.
      level3: Tym razem urządzisz swój szpital w zamożej okolicy. Ministerstwo Zdrowia ma nadzieję, że osiągniesz tu znaczne zyski. Musisz wypracować dobrą reputację, jednak gdy szpital będzie już działał, skoncentruj się na zarabianiu tak dużo, jak tylko możliwe. Prawdopodobnie wystąpią tu też Nagłe Wypadki. Mają miejsce, gdy do szpitala przybywa duża grupa ludzi z tą samą dolegliwością. Wyleczenie ich wszystkich przed upływem czasu podnosi twoją reputację i zapewnia premię. Mogą wystąpić choroby takie jak Syndrom Króla. Przeznacz więc pieniądze na budowę Sali Operacyjnej z Oddziałem tuż obok. Aby stanąć na wysokości zadania, zarób 20,000 PLN.
      level10: 'Ministerstwo prosi, abyś poza leczeniem chorób typowych dla tych stron, poświęcił nieco czasu na poprawę skuteczności leków. Zrzeszenie Pacjentów Bolibrzuch zgłosiło kilka krytycznych uwag. Nie daj im powodów do skarg i dopilnuj, by leki były jak najskuteczniejsze. Nikt nie powinien też czynić zarzutów samemu szpitalowi. Zmniejsz poziom umieralności. Dobrze będzie, jeśli zarezerwujesz trochę miejsca na Galaretownicę. Aby wygrać, udoskonal wszystkie leki do 80% skuteczności, zdobądź reputację 650 i zbierz w banku 500,000 PLN. '
      level11: 'Dostałeś szansę budowy szpitala najdoskonalszego ze wszystkich. W tej niezwykle renomowanej okolicy Ministerstwo chciałoby mieć szpital najlepszy z możliwych. Oczekujemy, że zarobisz mnóstwo pieniędzy, zyskasz znakomitą reputację i poradzisz sobie ze wszelkimi ewentualnościami. To jest bardzo ważna robota. Będziesz musiał naprawdę się czymś wyróżnić. Trzeba ci wiedzieć, że w tych okolicach widywane jest UFO. Twój personel powinien być przygotowany na niespodziewanych gości. Warunki wygranej to: wartość szpitala 240,000 PLN, 500,000 PLN na koncie i reputacja na poziomie co najmniej 700.'
      level18: ''
