    letter:
      1:
      - Drogi %s//
      - Cudownie! Poradziłeś sobie wspaniale z prowadzeniem tego szpitala. My, grube ryby z Ministerstwa Zdrowia, chcemy wiedzieć czy byłbyś zainteresowany większym projektem. Mamy pracę, do której wydajesz się być wręcz stworzony. Wynagrodzenie będzie wynosiło %d PLN. Bądź łaskaw rozważyć naszą propozycję.//
      - Czy jesteś zainteresowany pracą w Szpitalu %s?
      2:
      - Drogi %s//
      - Wyśmienicie! Dokonałeś wielkiego postępu w swoim szpitalu. Chcielibyśmy przenieść cię w inne miejsce, o ile masz ochotę na zmianę scenerii oraz nowe wyzwania. Nie musisz się zgadzać, jednak to może być w sam raz coś dla ciebie. Oferujemy pensję w wysokości %d PLN//
      - Czy chcesz pracę w Szpitalu %s?
      3:
      - Drogi %s//
      - Przez ostatni czas bardzo pomyślnie zarządzałeś tą placówką. Uważamy, że możesz dokonać wielkich rzeczy i chcemy zaoferować ci pozycję w innym szpitalu. Twoja pensja wyniesie %d PLN. Jesteśmy przekonani, że pokochasz tamtejsze nowe wyzwania.//
      - Czy chcesz przyjąć posadę w Szpitalu %s?
      4:
      - Drogi %s//
      - Gratulacje! My w Ministerstwie, jesteśmy zachwyceni twoimi umiejętnościami. Prawdę mówiąc, cały Departament Zdrowia uważa cię za złotego chłopaka. Wydaje nam się jednak, że wolałbyś nieco większe wyzwanie. Oferujemy ci pensję w wysokości %d PLN, ale decyzja należy do ciebie.//
      - Czy jesteś zainteresowany pracą dla Szpitala %s?
      5:
      - Drogi %s//
      - Witamy ponownie. Respektujemy twoje życzenie, aby pozostać w tym uroczym szpitalu, jednak zachęcamy cię do zmiany decyzji. Zaoferujemy ci pensję w wysokości %dPLN, jeżeli odejdziesz do innego szpitala i dobrze go poprowadzisz.//
      - Czy zechcesz się teraz przenieść do Szpitala %s?
      6:
      - Drogi %s//
      - Witamy. Wiemy jak szczęśliwy jesteś w tej uroczej i świetnie prowadzonej instytucji, jednak powinieneś posunąć swą karierę do przodu. Za przeniesienie będziesz miał prawo żądać %d PLN wynagrodzenia. Co ty na to?//
      - Czy zechcesz poprowadzić Szpital %s?
      7:
      - Drogi %s//
      - Dzień dobry! Ministerstwo Zdrowia chce wiedzieć, czy zdecydowałbyś się opuścić obecny szpital. Zdajemy sobie sprawę, że jest on uroczy i wspaniale prowadzony. Wiemy jednak, że sprostałbyś większym wyzwaniom, za które dostałbyś pensję w wysokości %d PLN.//
      - Czy akceptujesz stanowisko w Szpitalu %s?
      8:
      - Drogi %s//
      - Witamy ponownie. Odpowiedziałeś negatywnie na list, w którym oferowaliśmy ci czołowe stanowisko w nowym Szpitalu, z wynagrodzeniem %d PLN. Wydaje nam się jednak, że powinieneś przemyśleć tę decyzję. Tak się składa, że mamy dla ciebie idealną pracę.//
      - Czy przyjmiesz stanowisko w Szpitalu %s?
      9:
      - Drogi %s//
      - Udowodniłeś, że jesteś najlepszym administratorem szpitala w całej historii medycyny. Tak wspaniałe osiągnięcie nie mogło zostać niezauważone, chcielibyśmy więc powierzyć ci stanowisko Naczelnego Szefa Wszystkich Szpitali. Z tą prestiżową posadą wiąże się pensja w wysokości %d PLN. Od teraz ludzie będą witali cię brawami i okazywali uznanie, gdziekolwiek byś się nie znalazł.//
      - Dziękujemy za wszystko co zrobiłeś. Niech ci służy ta ciepła posadka.//
      - ''
      10:
      - Drogi %s//
      - Gratulujemy udanego kierowania wszystkimi placówkami jakie ci powierzyliśmy. Dzięki tak wspaniałym wynikom cały świat stoi przed tobą otworem. Oferujemy ci pensję w wysokości %d PLN oraz limuzynę. W zamian prosimy tylko, byś podróżował z miasta do miasta, spotykał się z wielbiącym cię społeczeństwem i promował ideę płatnego szpitalnictwa.//
      - Jesteśmy z ciebie dumni. Nie ma wśród nas nikogo, kto nie doceniałby twej ciężkiej pracy na rzecz ratowania życia.//
      - ''
      11:
      - Drogi %s//
      - Twoja wzorowa kariera stanowi inspirację dla każdego z nas. Dziękujemy za prowadzenie tak wielu szpitali i świetne radzenie sobie z każdym problemem. Pragniemy uhonorować cię dożywotnim wynagrodzeniem w wysokości %d PLN. Czy zechciałbyś podróżować odkrytą limuzyną od miasta do miasta i prowadzić wykłady o tym, jak osiągnąłeś tak wiele w tak krótkim czasie?//
      - Jesteś przykładem dla wszystkich myślących istot i każdy bez wyjątku uważa cię za bezcenny skarb.//
      - ''
      12:
      - Drogi %s//
      - Twoja kariera najlepszego zarządcy szpitala od czasów Mojżesza dobiega końca. Mając jednak na uwadze wpływ jaki wywarłeś na kameralny świat medycyny, Minister oferuje ci honorarium w wysokości %d PLN. Twoim jednym zadaniem byłoby otwierać festiwale w naszym imieniu, wodować statki i uczestniczyć w różnych pokazach. Cały świat pada przed tobą na kolana, a my skorzystalibyśmy na twojej popularności!//
      - Usilnie prosimy, przyjmij tę propozycję. To nie będzie ciężka praca, a dostaniesz samochód i eskortę policji, gdziekolwiek się wybierzesz.//
      - ''
