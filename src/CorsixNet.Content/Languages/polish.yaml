      tips:
      - Każdy szpital potrzebuje recepcji oraz Gabinetu Lekarskiego, aby móc normalnie funkcjonować. Później to zależy od rodzaju pacjentów którzy odwiedzają szpital. Budowa apteki to zawsze dobry wybór.
      - Maszyny takie jak Napowietrzacz wymagają konserwacji. Zatrudnienij dozorcę albo dwóch do naprawy twoich urządzeń, w przeciwnym wypadku będziesz ryzykował, że twój personel oraz pacjenci zostaną ranni.
      - Po chwili Twój personel będzie zmęczony. Upewnij się, że wybudujesz pokój socjalny, aby mogli się oni zrelaksować.
      - Umieść odpowiednią ilość kaloryferów aby utrzymać personel oraz pacjentów w cieple, w przeciwnym razie będą oni niezadowoleni. Skorzystaj z mapy miasta aby zlokalizować miejsca w szpitalu, które potrzebują więcej ogrzewania.
      - Poziom umiejśtności lekarzy ma ogromny wpływ na prędkość oraz jakość diagnozowania. Umieść wykwalifikowanego lekarza w Gabinecie Lekarskim a nie będziesz potrzebował wielu dodatkowych gabinetów diagnostycznych.
      - Asystenci oraz doktorzy mogą doskonalić swoje umiejętności ucząc się od konsultanta w sali treningowej. Jeżeli konsultant posiada specjalne kwalifikacje (chirurg, psychiatra, naukowiec), będzie on również przekazywał i tą wiedzę swoim uczniom.
      - Czy próbowałeś wpisać Europejski numer alarmowy (112) na faxie? Upewnij się, że masz włączony dźwięk!
      - Niektóre ustawienia gry, takie jak rozdzielczość oraz język, możesz dostosować w oknie opcji, dostępnym w głównym menu gry.
      - Wybrano język inny niż angielski jednak cały tekst jest wyświetlany po angielsku? Pomóż nam przetłumaczyć brakujące teksty na Twój język ojczysty!
      - Ekipa CorsixTH poszukuje wzmocnień! Czy jesteś zainteresowany kodowaniem, tłumaczeniem lub tworzeniem grafiki dla CorsixTH? Skontaktuj się z nami na naszym forum, liście email lub kanale IRC (corsix-th na freenode).
      - 'Jeśli znajdziesz jakiś błąd, zgłoś go w naszym systemie: th-issues.corsix.org'
      - Na każdym poziomie należy spełnić pewne wymagania, zanim będzie można przejść do kolejnego. Sprawdź, w oknie statusu, aby zobaczyć postęp w realizacji celów poziou.
      - Jeśli chcesz edytować lub usunąć istniejące pomieszczenia, można to zrobić za pomocą przycisku edycji pomieszczenia znajdującego się w pasku narzędzi na dole.
      - W tłumie oczekujących pacjentów, można szybko dowiedzieć się, którzy z nich czekają do danego gabinetu. Wystarczy najechać kursorem myszy na pacjenta.
      - Kliknij na drzwi gabinetu, aby zobaczyć oczekującą do niego kolejkę. Można dokonać tam również przydatnych zmian, takich jak na przykład zmiana kolejności w kolejce lub wysyłanie pacjenta do innego gabinetu.
      - Niezadowolony personel będzie często prosił o podwyżki. Upewnij się, że Twój personel pracuje w komfortowych warunkach aby tego uniknąć.
      - Pacjenci będą spragnieni podczas czekania w szpitalu, tym bardziej jeśli podkręcisz ogrzewanie! Umiejscowienie Automatów do napoi w strategicznych miejscach przyniesie dodatkowy dochód.
      - Jeżeli już spotkał się z daną chorobą, w każdym momencie możesz przerwać diagnozowanie pacjenta i odgadnąć jak go wyleczyć. Pamiętaj jednak, że może to zwiększyć ryzyko błędnej kuracji, co może prowadzić do śmierci pacjenta.
      - Nagłe wypadki mogą być dobrym źródłem dodatkowych pieniędzy, pod warunkiem, że posiadasz niezbędne gabinety do wyleczenia pacjentów w wyznaczonym czasie.
