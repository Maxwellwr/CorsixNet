    pay_rise:
      definite_quit: Cokolwiek zrobisz, nic mnie tu już nie zatrzyma. Mam dość tego miejsca.
      regular:
      - Jestem wykończony. Jeżeli nie chcesz, bym rzucił tę zakichaną robotę, pozwól mi odpocząć oraz daj podwyżkę o %d.
      - Jestem bardzo zmęczony. Żądam odpoczynku i podwyżki o %d, z pensją %d. No dalej, tyranie!
      - Daj spokój. Haruję tu jak pies. Daj mi premię %d, to zostanę w twoim szpitalu.
      - Jestem bardzo niezadowolony. Żądam podwyżki o %d, dającej mi pensję %d, inaczej spadam stąd.
      - Rodzice mówili mi, że w medycynie można sporo zarobić. Albo więc dasz mi podwyżkę o %d, albo zostanę producentem gier.
      - Mam dosyć. Daj mi przyzwoitą pensję. Podwyżka o %d powinna wystarczyć.
      poached: '%s zaproponowali mi %d. Jeśli nie zapłacisz mi tyle samo, odchodzę.'
