    room_descriptions:
      ultrascan:
      - Ultraskaner//
      - Udoskonalony przyrząd diagnozujący. Jest wart swej wysokiej ceny, o ile chcesz zapewnić pacjentom najlepsze warunki diagnozowania.//
      - 'Ultraskaner wymaga Lekarza. Musi być także konserwowany. '
      gp:
      - Gabinet Lekarski//
      - To najważniejszy gabinet w Twoim szpitalu. Nowi pacjenci są tu wysyłani, aby dowiedzieć się co im dolega. Następnie odsyłani są do dalszej diagnozy lub do gabinetów, w których mogą zostać wyleczeni. Możesz zbudować kolejny Gabinet Lekarski, jeżeli w tym będzie zbyt tłoczno. Rozmiar gabinetu i liczba urządzeń są wyznacznikiem autorytetu jakim cieszy się pracujący w nim Lekarz. To dotyczy również innych pomieszczeń.//
      - 'Do funkcjonowania Gabinetu Lekarskiego niezbędny jest Lekarz. '
      fracture_clinic:
      - Gabinet Ortopedyczny//
      - Usuwacz Gipsu używa potężnego przemysłowego lasera do przecięcia stwardniałego gipsu, wywołując przy tym nieznaczny ból u pacjenta.//
      - 'Gabinet Ortopedyczny potrzebuje Pielęgniarki. Wymaga również częstej konserwacji. '
      tv_room:
      - SALA TV NIE UŻYWANA
      inflation:
      - Napowietrzalnia//
      - Pacjenci z bolesnym, acz zabawnym Głowowzdęciem muszą odwiedzić Napowietrzalnię, gdzie przerośnięta głowa zostaje przebita, a następnie napompowana do odpowiednich rozmiarów.//
      - 'Napowietrzalnia musi mieć Lekarza do obsługi. Musi być także pod stałym nadzorem Dozorcy. '
      jelly_vat:
      - Przychodnia Galaretowatości//
      - Pacjenci dotknięci przezabawnym choróbskiem Galaretowatość, muszą dokiwać się do Przychodni Galaretowatości, gdzie umieszcza się ich w Galaretownicy. Właśnie w ten, nie do końca jasny dla medycyny sposób, zostają wyleczeni.//
      - 'Przychodnia Galaretowatości potrzebuje Lekarza. Jak również nadzoru Dozorcy. '
      scanner:
      - Skaner//
      - Pacjenci są diagnozowani przy użyciu wymyślnego Skanera, po czym wracają do Gabinetu Lekarskiego w celu dalszego leczenia.//
      - 'Skaner wymaga Lekarza. Musi być także konserwowany. '
      blood_machine:
      - Analizator Krwi//
      - Analizator Krwi jest częścią wyposażenia diagnozującego, które sprawdza komórki krwi pacjenta i określa ich stan.//
      - 'Analizator Krwi wymaga Lekarza. Musi być także konserwowany. '
      pharmacy:
      - Apteka//
      - Pacjenci, którzy zostali zdiagnozowani i mogą być wyleczeni dzięki lekom, muszą zgłosić się po nie do Apteki. W miarę jak będą wymyślane nowe leki, ten gabinet stanie się naprawdę oblegany. Prawdopodobnie będziesz musiał wtedy zbudować drugą Aptekę.//
      - 'Do pracy w Aptece potrzebna jest Pielęgniarka. '
      cardiogram:
      - Kardiograf//
      - Diagnozuje się tutaj pacjentów zanim wrócą do Gabinetu Lekarskiego i zostaną wysłani na leczenie.//
      - 'Kardiograf wymaga Lekarza. Musi być także konserwowany. '
      ward:
      - Oddział//
      - Pacjenci przebywają tu na obserwacji podczas diagnozy. Poza tym kierowani są tu przed zabiegiem chirurgicznym.//
      - 'Oddział potrzebuje Pielęgniarki. '
      psych:
      - Psychiatra//
      - Pacjenci ze zdiagnozowaną chorobą psychiczną muszą odwiedzić Gabinet Psychiatryczny, aby otrzymać poradę. Psychiatra diagnozuje pacjenta pod kątem dolegliwości i jeśli mają one podłoże psychiczne, leczy go z wykorzystaniem swej niezawodnej kozetki.//
      - 'W Gabinecie Psychiatrycznym wymagany jest Lekarz ze specjalizacją Psychiatry. '
      staff_room:
      - Pokój Socjalny//
      - 'Twój personel podczas pracy męczy się. W tym pokoju pracownicy mogą się odprężyć i zrelaksować. Gdy są zmęczeni, pracują wolniej, domagają się większych podwyżek i popełniają więcej błędów. Budowa Pokoju Socjalnego z bogatym wyposażeniem jest bardzo opłacalna. Upewnij się, że znajdzie się tam miejsce dla kilku osób jednocześnie. '
      operating_theatre:
      - Sala Operacyjna//
      - Ważne pomieszczenie, w którym leczy się różnorodne schorzenia. Sala musi mieć sporą powierzchnię oraz powinna zawierać odpowiednie wyposażenie. Jest to nieodzowna część twojego szpitala.//
      - 'Sala operacyjna wymaga dwóch Lekarzy ze specjalizacją Chirurga. '
      training:
      - Sala Szkoleniowa//
      - Twoi Asystenci oraz Doktorzy mogą tutaj zdobywać dodatkowe specjalizacje. Konsultant ze specjalizacją Chirurga, Psychiatry lub Naukowca przekazuje swoją wiedzę każdemu szkolonemu Lekarzowi. Lekarze, którzy posiadają już te specjalizacje, będą mogli je tutaj rozwijać.//
      - 'Sala Szkoleniowa potrzebuje Konsultanta. '
      dna_fixer:
      - Przychodnia DNA//
      - DNA pacjentów, którzy zostali porwani przez obcych, musi zostać wymienione w tym gabinecie. Re-GEN-erator to bardzo skomplikowane urządzenie, dlatego wskazane jest mieć w pogotowiu gaśnicę, tak na wszelki wypadek.//
      - 'Re-GEN-erator wymaga okresowego przeglądu przez Dozorcę. Potrzebny jest także Lekarz ze specjalizacją Naukowca. '
      research:
      - Dział Badawczy//
      - Tutaj wymyśla się lub ulepsza leki oraz sposoby leczenia. To bardzo ważna część szpitala, dzięki której liczba wyleczonych poszybuje w górę.//
      - 'W Dziale Badawczym musi pracować Lekarz ze specjalizacją Naukowca. '
      hair_restoration:
      - Gabinet Przeszczepu Włosów//
      - Pacjenci cierpiący na ekstremalne Łysienie są kierowani do tego gabinetu w celu przeszczepienia włosów. Lekarz obsługuje maszynę, która szybko obsiewa łysą głowę pacjenta nowymi cebulkami.//
      - 'W gabinecie Przeszczepu Włosów potrzebny jest Lekarz. Wymaga on także okresowej konserwacji. '
      general_diag:
      - Badania Podstawowe//
      - Pacjenci wymagający dalszej diagnozy są wysyłani tutaj. Jeżeli w Gabinecie Lekarskim nie wykryta zostanie przypadłość pacjenta, zazwyczaj zostanie to dokonane w gabinecie Badań Podstawowych. Stąd pacjenci zostają odesłani do Gabinetu Lekarskiego w celu analizy wyników przeprowadzonych tu badań.//
      - 'Do pracy w gabinecie Badań Podstawowych wymagany jest Lekarz. '
      electrolysis:
      - Gabinet Elektrolizy//
      - Pacjenci cierpiący na Włochaciznę są kierowani do tego gabinetu, gdzie specjalna maszyna zwana Elektrolizerem wyszarpuje włosy i zalepia elektrycznie pory specjalną mieszaniną podobną do tynku.//
      - 'Gabinet Elektrolizy potrzebuje Lekarza. Musi być także doglądany przez Dozorcę. '
      slack_tongue:
      - Przychodnia Obrzynania//
      - Pacjenci zdiagnozowani w Gabinecie Lekarskim z chorobą Obwisłego Języka są kierowani do tego gabinetu. Przy pomocy nowoczesnej aparatury Lekarz wyciąga i obcina język, przywracając pacjenta do zdrowia.//
      - 'Przychodnia Obrzynania potrzebuje Lekarza. Wymaga również częstej konserwacji. '
      toilets:
      - Toalety//
      - 'Pacjenci, którzy poczują zew matki natury, będą musieli skorzystać z twoich komfortowych toalet. Jeżeli spodziewasz się dużo gości, możesz zbudować dodatkowe latryny i umywalki. Być może trzeba będzie rozważyć budowę kolejnych toalet w innych częściach szpitala. '
      no_room:
      - ''
      x_ray:
      - Rentgen//
      - Rentgen używa specjalnych promieni, aby zrobić zdjęcie wnętrza pacjenta. Dzięki temu lekarz wie, co dzieje się wewnątrz chorego.//
      - 'Rentgen wymaga Lekarza. Musi być także konserwowany. '
      decontamination:
      - Gabinet Odkażania//
      - Pacjenci, którzy zostali narażeni na Napromieniowanie są natychmiast kierowani do Gabinetu Odkażania. Pomieszczenie to posiada prysznic, który oczyszcza ich ze strasznego napromieniowania i brudu.//
      - 'Do obsługi Prysznica wymagany jest Lekarz. Musi być także nadzorowany przez Dozorcę. '
