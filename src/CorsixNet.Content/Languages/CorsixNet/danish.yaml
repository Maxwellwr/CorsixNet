      no_desk_6: 'Du har en receptionist, så hvad med at bygge et receptionsbord til hende?'
      no_desk_7: 'Du har bygget receptionsbordet, så hvad med at ansætte en receptionist? Du får ingen patienter, för det er ordnet!'
