# CorsixNet's own interface strings in Danish: the texts CorsixTH has no string for (corsixnet.*), and Danish for
# the CorsixTH strings its translation leaves in English. Laid over CorsixTH's translation by CorsixLanguages; the
# English stand-ins live in the code. Placeholders: %1%, %2%... by number, %% for a percent sign.
# Only characters of code page 437, as the game's bitmap font draws it: ø is written ö, as CorsixTH does.
