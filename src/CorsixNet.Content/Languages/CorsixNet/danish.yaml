      norest_on_cheat: 'Åh nej! Dit personale har vist fået alt for meget koffein og föler ikke længere behov for at hvile.'
      queuejump_off_cheat: 'Folk er blevet egoistiske og lader ikke længere næsten döde patienter springe köen over.'
      queuejump_on_cheat: 'Dine patienter ved, hvordan man står i kö. De lader de næsten döde komme forrest.'
