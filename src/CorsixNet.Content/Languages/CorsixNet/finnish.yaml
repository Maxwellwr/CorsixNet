      no_desk_2: 'Hienoa, tämä on varmaan maailmanennätys: lähes vuosi eikä yhtään potilasta! Jos haluat jatkaa tämän sairaalan johtajana, sinun täytyy palkata vastaanottoapulainen ja rakentaa hänelle tiski!'
      no_desk_3: 'Aivan loistavaa, lähes vuosi eikä vastaanotossa ole ketään! Miten kuvittelet saavasi potilaita? Hoida asia kuntoon ja lopeta pelleily!'
      no_desk_5: 'No oli jo aikakin, potilaita pitäisi alkaa saapua pian!'
      no_desk_6: 'Sinulla on vastaanottoapulainen, joten miten olisi tiski hänelle?'
      no_desk_7: 'Olet rakentanut vastaanottotiskin, joten miten olisi vastaanottoapulainen? Potilaita ei tule, ennen kuin tämä on hoidettu!'
