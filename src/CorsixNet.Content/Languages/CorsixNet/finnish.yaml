      cannot_afford_2: 'Sinulla ei ole pankissa tarpeeksi rahaa tähän ostokseen!'
      cannot_afford_machine: 'Tarvitset pankkiin vähintään $%1%, jotta sinulla on varaa uuteen laitteeseen (%2%)!'
