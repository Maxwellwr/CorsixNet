    room_descriptions:
      gp:
      - Кабинет терапевта//
      - Это основной диагностический кабинет в вашей больнице. Все новые пациенты приходят сюда чтобы узнать, что с ними не так. Отсюда они отправляются на дальнейшую диагностику или сразу на лечение. Вам может понадобиться несколько таких кабинетов, если пациентов будет слишком много. Чем просторнее помещение, и чем больше в нем предметов, тем выше престиж работающего здесь доктора. Впрочем, это относится ко всем кабинетам.//
      - В кабинете терапевта может работать любой доктор.
      general_diag:
      - Общая диагностика//
      - Сюда направляются пациенты, которым требуется дополнительная диагностика. Здесь у врача значительно больше инструментов для обследования, чем у терапевта. Пациент вернется к терапевту с результатами обследования для постановки диагноза.//
      - В кабинете общей диагностики может работать любой доктор.
      ultrascan:
      - Ультрасканер//
      - Ультрасканер - это практически вершина прогресса диагностического оборудования. Он очень дорогой, но он того стоит.//
      - Ультрасканеру для полноценной работы требуется доктор. Также, ему требуется обслуживание.
      fracture_clinic:
      - Лечение переломов.//
      - Сюда приходят пациенты с поломанными костями. Используя мощный промышленный лазер, разгипсовочный аппарат срезает застывший гипс, что может вызывать незначительную агонию у пациента.//
      - В этом кабинете работает медсестра. Машине также требуется частый ремонт.
      inflation:
      - Кабинет надувания//
      - В кабинет надувания направляют пациентов с выводящим из строя и очень болезненным недугом раздутой головы. Здесь их безразмерные черепа хлопнут и немедленно снова надуют до точно рассчитанного нормального давления.//
      - В кабинете надувания может работать любой доктор. Аппарату требуется регулярный ремонт.
      jelly_vat:
      - Лечение ожеления//
      - Пациенты, страдающие забавной болезнью ожеления, должны дотрястись до этого кабинета, где их поместят в специальный бак. Медицинская наука не знает, что там происходит, но после процедуры им становится лучше.//
      - В этом кабинете может работать любой доктор. Вам также понадобится рабочий для обслуживания аппаратов.
      scanner:
      - Сканер//
      - При помощи этого сложного оборудования можно поставить очень точный диагноз.//
      - Со сканером может работать любой доктор. Это устройство требует регулярного обслуживания.
      blood_machine:
      - Анализатор крови//
      - Этот аппарат разделяет кровь пациента на клетки и выясняет что с ними не в порядке.//
      - С анализатором крови может работать любой доктор. Это устройство требует регулярного обслуживания.
      pharmacy:
      - Аптека//
      - Пациенты, которым поставлен диагноз и прописано лекарство, получают его в аптеке. Поскольку многие болезни излечиваются медикаментами, со временем тут может стать тесновато, и вам понадобится еще одна аптека.//
      - В аптеке работает медсестра.
      cardiogram:
      - Кардиография//
      - Здесь пациентов проверяют на наличие болезней сердца и проводят стресс-тест на беговой дорожке. Затем с полученными результатами возвращают к терапевту.//
      - В кардиографии может работать любой доктор. Беговой дорожке требуется регулярное обслуживание.
      ward:
      - Палата//
      - Во время обследования пациенты содержатся здесь под наблюдением медсестры. Также, тут они готовятся к операции.//
      - В палате работает медсестра.
      psych:
      - Психиатрия//
      - Пациенты, страдающие от душевных недугов, должны посетить кабинет психиатра. Доктор обследует пациентов, и, если у них не все в порядке с головой, предложит прилечь на кушетку и побеседовать.//
      - В этом кабинете может работать только специально обученный психиатр.
      staff_room:
      - Комната персонала//
      - После тяжелого рабочего дня, ваши сотрудники могут посетить эту комнату, чтобы отдохнуть и расслабиться. Усталые медики тормозят, хотят повышения зарплаты и могут даже уволиться. Также, они начинают чаще ошибаться. Убедитесь, что в вашей комнате достаточно места и развлечений для нескольких человек сразу.
      operating_theatre:
      - Операционная//
      - В этом важном помещении излечивают целый ряд заболеваний. Операционная должна быть просторной и хорошо оснащенной. Это очень важная часть любой больницы.//
      - В операционной должны работать два квалифицированных хирурга.
      training:
      - Лекционная//
      - Ваши доктора могут повышать свою квалификацию в этой комнате. Лектор с дипломом хирурга, психиатра или исследователя может научить своих коллег всему, что знает. Те же, кто уже имеет диплом, здесь могут научиться лучше применять знания на практике.//
      - Читать лекции здесь может только консультант.
      dna_fixer:
      - Восстановление ДНК//
      - Пациенты, имевшие несчастье войти в контакт с пришельцами из других миров, должны пройти процедуру починки ДНК. Поскольку восстановитель ДНК – аппарат сложная и высокотехнологичная, настоятельно рекомендуем разместить в кабинете огнетушитель, на всякий пожарный.//
      - Восстановитель требует регулярного обслуживания. И работать с ним могут только доктора с дипломом исследователя.
      research:
      - Исследовательский отдел//
      - Здесь совершаются открытия и улучшаются существующие лекарства и методы лечения. Это очень полезный отдел, его работа творит чудеса в деле улучшения вашей статистики.//
      - В исследовательском отделе могут работать только доктора с дипломом исследователя.
      hair_restoration:
      - Восстановление волос//
      - Машина восстановителя волос – последняя надежда для пациентов, страдающих плешивостью в терминальной стадии. При помощи этого аппарата доктор может быстро насадить совершенно новый волосяной покров.//
      - В кабинете оволосителя может работать любой доктор. Время от времени аппарату требуется ремонт.
      electrolysis:
      - Комната электролиза//
      - Больные оволосением направляются в эту комнату, где специальный аппарат, называемая электролизатором, уничтожает излишние волосы и электрически запаивает поры при помощи состава, сильно напоминающего цемент.//
      - В кабинете электролиза может работать любой доктор. Машина также требует обслуживания.
      slack_tongue:
      - Лечение длинного языка//
      - Пациенты с этим неутешительным диагнозом направляются в эту комнату для лечения. При помощи высокоточного оборудования, квалифицированный специалист возвращает языку нормальные размер и форму, а пациенту – хорошее самочувствие.//
      - Здесь может работать любой доктор. Машину также надо иногда чинить.
      toilets:
      - Туалет//
      - Следуя зову природы, пациентам надо иногда облегчиться в комфортной обстановке ваших санитарных помещений. Вы можете установить дополнительные раковины и кабинки, если ожидаете наплыва посетителей. Иногда бывает полезно разместить дополнительные помещения в разных частях больницы.
      no_room:
      - ''
      x_ray:
      - Рентген//
      - Сделанные при помощи специального излучения снимки внутренностей пациентов помогают врачам установить, что там не в порядке.//
      - В кабинете рентгена может работать любой доктор. Также, аппарату требуется обслуживание.
      decontamination:
      - Комната обеззараживания//
      - Пациенты, подвергшиеся воздействию радиации, незамедлительно направляются в комнату обеззараживания. Приятный душ смоет с них всю ужасную радиацию и опасные отходы.//
      - Оперировать душем может любой доктор. Также, аппарату требуется обслуживание.
      tv_room:
      - Телевизионная комната не использовалась
