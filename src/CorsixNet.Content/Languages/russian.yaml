    totd_window:
      previous: Предыдущая подсказка
      tips:
      - Любая больница нуждается в регистратуре и кабинете терапевта. Именно в них решается дальнейшая судьба пациента и он направляется на дальнейшее лечение. Кстати, аптека тоже не помешает.
      - Аппараты, например, аппарат надувания, требуют регулярного ремонта. Для этого нужно нанять одного-двух работников. Изношенные аппараты могут доставить много неприятностей как персоналу, так и пациентам.
      - Персоналу свойственно уставать. Не забывайте строить комнаты отдыха для них.
      - Устанавливайте достаточно батарей отопления для поддержания тепла в больнице, иначе персонал и пациенты будут недовольны. Распределение тепла по помещению можно посмотреть на карте города.
      - Профессионализм доктора сильно влияет на скорость постановки диагноза и качество лечения. Один профессиональный терапевт способен заменить двух неопытных.
      - Студенты и доктора могут повышать свой профессиональный уровень на лекциях консультанта. Если консультант обладает специальными навыками (психиатра, хирурга или исследователя), он сможет передать их ученикам.
      - А вы пробовали набирать европейский номер службы спасения (112) на факсе? Перед тем, как пробовать, включите звук!
      - Вы можете изменить некоторые настройки, например разрешение экрана или язык игры, перейдя в меню настроек из главного меню или непосредственно из игры.
      - Везде английские слова, хотя вы выбрали в настройках совсем не английский язык? Помогите закончить перевод игры!
      - Команда CorsixTH нуждается в вашей помощи! Если вы хотите помочь в написании кода, создании графики или перевода игры, свяжитесь с нами на Дискорд-сервере, Саб-реддите или на сервере Matrix. Ссылки на нашем вебсайте (CorsixTH.com)
      - 'Если вы нашли ошибки, пишите на наш багтрекер: th-issues.corsix.org'
      - Каждый уровень игры требует выполнения определенных условий для его завершения. Периодически заглядывайте в окно статуса, чтобы знать, какие условия выполнены, а какие - еще нет.
      - Для редактирования или удаления кабинета есть специальная кнопка на панели внизу экрана.
      - Чтобы разобраться в толпе пациентов, наведите курсор на кабинет, и ожидающие своей очереди посетители будут выделены.
      - Щелкните на двери кабинета для просмотра очереди. Пациентов, стоящих в очереди можно перемещать, направлять в другие кабинеты и даже выгонять.
      - Недовольный персонал требует повышения зарплат. Убедитесь в том, что ваши работники пребывают в комфортабельных условиях труда.
