    introduction_texts:
      demo: Добро пожаловать в демонстрационную больницу!//К сожалению демонстрационная версия содержит только этот уровень. Но этого более чем достаточно, чтобы занять вас на некоторое время! Вы будете сталкиваться с разными заболеваниями, которые будет требовать разных кабинетов для лечения. Время от времени, будут поступать пациенты, требующие немедленного лечения. Так же вам необходимо разрабатывать новые кабинеты используя исследовательский кабинет. Ваша цель заработать $100 000, стоимость больницы должна быть $70 000, а репутация 700. Кроме того, вы должны вылечивать не менее 75% своих пациентов. Удостоверьтесь, что ваша репутация не упадет ниже 300 и вы не убиваете более 40% ваших пациентов. Иначе вы проиграете.//Удачи!
      level1: Добро пожаловать в вашу первую больницу!//Чтобы начать принимать пациентов, постройте регистратуру и кабинет терапевта, наймите регистраторшу и доктора. Потом просто ждите когда придут первые пациенты.Также, вам не помешает построить кабинет психиатра и нанять доктора с соответствующим дипломом. Чтобы лечить больных, вам потребуется аптека и медсестра. Приготовьтесь принимать пациентов с раздутой головой. Для них надо будет построить кабинет со специальным аппаратом. Попробуйте вылечить 10 человек и смотрите, чтобы ваша репутация не упала ниже 200.
      level2: В этой местности встречается больше разных заболеваний. Подготовьте больницу к наплыву пациентов и не забудьте построить исследовательский отдел. Очень важно поддерживать ваше заведение в чистоте и стараться повысить свою репутацию. Ожидайте прибытия пациентов с длинными языками - постройте для них специальный кабинет. Комната кардиографии поможет вам точнее ставить диагнозы. Оба этих кабинета должны быть исследованы прежде, чем вы сможете их построить. В окне карты вы теперь можете приобретать дополнительные корпуса для вашей больницы. Ваша цель - заработать 10 000$, вылечить 40 человек и не уронить репутацию ниже 300.
      level3: На этот раз ваша больница будет расположена в богатом районе. Министерство здравоохранения ожидает получить здесь нехилую прибыль. Для начала, вам предстоит заработать хорошую репутацию, затем сосредоточьтесь на превращении ее в деньги. Знайте, что вы можете столкнуться с чрезвычайными ситуациями. Это означает, что к вам в больницу прибудет группа людей с серьезным заболеванием. Если вы успеете их вылечить за ограниченное время, то заработаете солидный бонус и хорошую репутацию. Вам придется столкнуться с синдромом Короля, а также выделить деньги на постройку палаты и операционной. Заработайте 20 000$ чтобы добиться успеха.
      level4: Проследите, чтобы пациенты были довольны, хорошо обслужены и не умирали. Ваша репутация имеет большое значение, так что постарайтесь поднять ее как можно выше. Не беспокойтесь о деньгах - они придут вместе с высокой репутацией. Теперь вы также можете обучать ваших докторов, чтобы повысить их навыки. Так они смогут справляться даже с самыми необычными болезнями. Поднимите вашу репутацию до 500.
      level5: С таким разнообразием заболеваний, как в этой больнице, вам не придется сидеть без дела.Ваши доктора - вчерашние студенты, так что им необходимо будет подучиться.У вас есть три консультанта, которые помогут обучить новичков, постарайтесь их не разозлить.А еще наша больница стоит прямо над разломом Сан Андроид.Ожидайте землетрясений.Они могут повредить ваши аппараты и нарушить работу больницы.Поддерживайте репутацию не ниже 400 и заработайте 50 000$. Также, вылечите 200 пациентов.
      level6: Опираясь на весь свой опыт, постройте хорошо организованную больницу, приносящую стабильный доход и способную вылечить все, что угодно.Знайте, что в этой местности особенно быстро распространяются всякие инфекции.Если в вашей больнице не будет идеально чисто, ждите вспышек эпидемий среди пациентов.Заработайте 150 000$ и доведите стоимость больницы до 140 000$.
      level7: Здесь вы будете под неусыпным наблюдением министерства здравоохранения, так что постарайтесь, чтобы деньги текли рекой, а репутация стремилась ввысь. Мы не можем вам позволить убивать пациентов - это плохо для бизнеса. Проследите, чтобы у вас было все необходимое оборудование и высококлассные специалисты. Заработайте 600 репутации плюс 200 000$ на банковский счет.
      level8: Ваша задача - построить как можно более эффективную и рентабельную больницу. Народ здесь живет на широкую ногу, так что не стесняйтесь стричь капусту изо всех сил. Нет, конечно, лечить людей - хорошо, и все такое, но вам ОЧЕНЬ нужны их деньги. Проследите, чтобы ваши пациенты были в состоянии дойти до кассы. Накопите на счету, ни много ни мало, 300 000$ чтобы завершить этот уровень.
      level9: Теперь, когда на счету министерства полно денег, и сам министр разъезжает на новеньком лимузине, вы вновь можете заняться постройкой приличной, хорошо организованной больницы для самых нуждающихся. Будьте готовы к любым неприятностям.Если вы озаботитесь приобретением всего необходимого оборудования и кадров, ничто не сможет причинить вам проблем. Ваша больница должна стоить 200 000$, а на вашем счету должно быть 400 000$. Мы не примем меньшего.
      level10: Помимо излечения всех болезней, которые бывают в этом захолустье, министерство просит вас уделить внимание исследованию лекарств.К нам поступают жалобы от некоего Овсика, местного активиста, так что улучшайте свои лекарства, чтобы не ударить в грязь лицом.Также, не давайте поводов для упреков. Сведите число трупов к минимуму.Кстати, отведите место для кабинета лечения ожеления.Улучшите все лекарства до 80% эффективности, повысьте репутацию до 650 и соберите 500 000$.
      level11: Вам предоставляется шанс построить идеальную больницу. Это невероятно престижное место, и министерство хотело бы видеть здесь соответствующее лечебное учреждение. Мы ожидаем от вас большой прибыли, высокой репутации и использования всех возможных средств для достижения цели. Это очень важная работа. Чтобы ее выполнить, вам придется лезть из кожи вон. Кстати, в этой местности замечены НЛО. Интересно, ваш персонал готов к подобным сюрпризам? Доведите стоимость больницы до $240,000, соберите $500,000 и поднимите репутацию до 700.
      level12: 'Эта задача - вершина всех задач. Восхищенное вашим успехом, министерство предлагает вам сложную работу: им нужен кто-то, кто построит еще одну идеальную больницу, принесет огромное количество денег и заработает невероятную репутацию. От вас ожидается, что вы скупите всю землю в округе, вылечите всех (да-да, именно всех) и получите все награды. Возьметесь за дело?Заработайте $650,000, вылечите 750 человек и ваша репутация не должна быть ниже 800, чтобы выиграть.'
      level13: 'Ваше невероятное мастерство владения больницей заинтересовало сверхсекретный отдел сверхсекретной службы. У них есть для вас сюрприз: переполненная крысами больница требует эффективного вмешательства. Уничтожьте как можно больше крыс, пока рабочие не убрали весь мусор. Справитесь?'
      level14: 'Перед вами очередное задание: эта больница богата разного рода неожиданностями. Приведите ее к успеху и станьте победителем из победителей. Не думайте, что все будет очень легко. Перед вашим лицом предстанут весьма жесткие условия Удачи!'
      level15: Итак, освоим важные моменты для создания хорошей больницы.//Иногда вашим врачам требуется помощь в постановке правильного диагноза. Для дополнительных обследований необходимо построить специальные кабинеты, например, кабинет общей диагностики.
      level16: Вы уже поставили диагнозы нескольким пациентам, и пора приниматься за их лечение. Для этого необходимо построить различные кабинеты. Для начала постройте аптеку и наймите медсестру, которая будет выдавать пациентам спасительные лекарства.
      level17: 'Последнее предупреждение: зорко следите за репутацией, ведь именно она привлекает к вам пациентов из самых дальних уголков страны, а соответственно и их деньги. Если вы не будете убивать много людей и они будут довольны вашей больницей, особых проблем у вас не возникнет.//Теперь вы сами себе хозяин. Удачи! На этом все.'
      level18: ''
    letter:
      1:
      - Уважаемый %s,//
      - Великолепно! Вы превосходно справляетесь с управлением этой больницей. Мы, большие шишки из министерства здравоохранения, хотим предложить вам заняться более крупным проектом. Вы идеально подходите нам для этой работы. Мы готовы платить вам %d$. Подумайте над нашим предложением.//
      - Вас интересует работа в больнице «%s»?
      2:
      - Уважаемый %s,//
      - Очень хорошо! Вы добились больших успехов в вашей больнице. Если вы не прочь сменить обстановку и не боитесь трудностей, мы можем предложить вам работу в другом месте. Соглашайтесь, и вы не пожалеете. Ваша зарплата составит %d$//
      - Вы хотите работать в больнице «%s»?
      3:
      - Уважаемый %s,//
      - Вы добились огромных успехов, управляя этой больницей. Посему, мы предсказываем вам большое будущее и хотим предложить новый пост. Мы готовы платить вам %d$ и думаем, вы не прочь принять этот вызов.//
      - Вы хотите управлять больницей «%s»?
      4:
      - Уважаемый %s,//
      - Поздравляем! У нас тут в министерстве все под впечатлением от ваших управленческих способностей. Мы возлагаем на вас большие надежды! Поэтому, мы хотим предложить вам работу посложнее. Ваша зарплата составит %d$, решение за вами.//
      - Вас интересует работа в больнице «%s»?
      5:
      - Уважаемый %s,//
      - Снова здравствуйте. Мы понимаем, как вам неохота покидать эту уютную больничку, но все же убедительно просим вас пересмотреть свое мнение. Мы будем платить вам %d$, если вы отправитесь в другую больницу и организуете ее работу так же хорошо.//
      - Вы согласны отправиться работать в больницу «%s»?
      6:
      - Уважаемый %s,//
      - Поздравляем. Представляем, как вы счастливы владеть этой прекрасной больницей, но следующая ступенька карьерной лестницы уже ждет вас. Вы будете получать $%d, если согласитесь. Надеемся, вы сделаете правильный выбор.//
      - Согласны ли вы занять свое место в больнице «%s»?
      7:
      - Уважаемый %s,//
      - Добрый день! В министерстве здравоохранения всем очень интересно, что держит вас в вашей больнице. Может быть, ваше заведение и превосходно, но, все же, хотим предложить вам перевод в новую больницу, где вас ожидают новые перспективы и зарплата в $%d.//
      - Вы согласны перейти работать в больницу «%s»?
      8:
      - Уважаемый %s//,
      - И еще раз, здравствуйте. Вы отклонили наше предыдущее предложение новой работы с зарплатой в %d$. Однако, мы настаиваем на пересмотре вами своего решения. Вот увидите, новое место работы намного лучше!//
      - Пожалуйста, согласитесь занять пост руководителя в больнице «%s».
      9:
      - Уважаемый %s//,
      - На протяжении длительного времени вы зарекомендовали себя как отличный руководитель. Такая заслуга не может остаться без награды, и мы рады предложить вам пост главного управляющего больницами. Это важная должность, и размер зарплаты составит $%d. Вы взойдете на пост по ковровой дорожке, и люди встретят вас с почетом.//
      - Вами пройден большой путь. Спасибо за все, что вы делаете.//
      - ''
      10:
      - Уважаемый %s//,
      - 'Примите наши поздравления: вы изумительно справляетесь со всеми поставленными задачами. Ваш профессионализм открывает для вас множество путей. Вы будете получать пенсию в размере $%d и иметь личный лимузин, если согласитесь на наше предложение разъезжать по городам, проводя организационную работу в больницах.//'
      - Мы гордимся вами. Еще никто не отдавал столько сил на спасение человеческих жизней.//
      - ''
      11:
      - Уважаемый %s//,
      - Ваша карьера была образцовой, вы вдохновляли нас. Спасибо за посещение такого количества больниц и огромную проделанную работу. Предлагаем вам пожизненные выплаты в размере $%d, а вы будете разъезжать в роскошном кабриолете по больницам городов и проводить мастер-классы по достижению успеха в карьере.//
      - Вы являетесь примером для каждого здравомыслящего человека, и все, без исключения, хотели бы стать такими же успешными, как вы.//
      - ''
      12:
      - Уважаемый %s//,
      - Ваша успешная карьера лучшего со времен Моисея управляющего больницей близится к завершению. Однако, учитывая ваши заслуги в медицине, министерство здравоохранения готово предложить вам $%d просто за то, что вы будете появляться на презентациях, открытиях, запусках кораблей и иногда на ток-шоу. Весь мир жаждет видеть вас, и ваше имя будет отличной рекламой для нас!//
      - Пожалуйста, примите наше предложение. Работа несложная, и вам будет предоставлен автомобиль и полицейский эскорт, куда бы вы ни отправились.//
      - ''
      custom_level_completed: Отличная работа! Вы выполнили все задачи на этой карте!
      dear_player: Уважаемый %s
      return_to_main_menu: Вернетесь в главное меню или продолжите игру?
