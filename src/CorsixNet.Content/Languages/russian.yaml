        alien_dna_only_by_emergency: К сожалению, пациенты с инопланетной ДНК недостаточно проанимированы, поэтому в больницу они приходят только по экстренным случаям. Если вы хотите, чтобы они приходили так же как и обычные пациенты, выключите эту опцию.
