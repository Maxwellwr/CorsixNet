    staff_descriptions:
      good:
      - Nagyon gyors és szorgalmas.
      - Nagyon lelkiismeretes és gondos.
      - Nagyon sokoldalú.
      - Barátságos és mindig jókedvű.
      - Rettenetesen kitartó. Reggeltől estig dolgozik.
      - Nagyon udvarias és jó modorú.
      - Hihetetlenül tehetséges és hozzáértő.
      - Nagyon szeret teljesíteni a munkában.
      - Maximalista, aki soha nem adja fel.
      - Mosolyával mindig jobb kedvre deríti az embereket.
      - Elragadó, udvarias és segítőkész.
      - Motivált és elkötelezett a munka iránt.
      - Természetesen viselkedik és keményen dolgozik.
      - Hűséges és barátságos.
      - Figyelmes és lehet rá számítani vészhelyzetekben.
