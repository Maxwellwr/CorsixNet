    adviser:
      warnings:
        money_low: Estás a ficar sem dinheiro!
        no_desk_7: Já construiu o balcão de atendimento, então que tal contratar uma recepcionista? Não irá atender clientes até que resolva isto!
        researcher_needs_desk_1: Um Investigador precisa de ter uma secretária onde trabalhar.
        no_desk_6: Já tem a recepcionista, então que tal construir uma balcão de atendimento para ela trabalhar?
        nurse_needs_desk_1: Cada Enfermeira necessita de uma secretária onde trabalhar.
        researcher_needs_desk_2: O seu Investigador está satisfeito que o tenha deixado descansar um pouco. Se quer ter mais pessoal a fazer pesquisa, então precisa de dar uma secretária a cada um deles.
        no_desk_5: Está na hora, devem estar a chegar pacientes a qualquer momento!
        no_desk_4: Uma recepcionista precisa de ter o seu posto de trabalho para atender os pacientes assim que chegam.
        researcher_needs_desk_3: Cada Investigador necessita de uma secretária onde trabalhar.
        cannot_afford_2: Não tem dinheiro suficiente no banco para fazer essa compra!
        nurse_needs_desk_2: A sua Enfermeira está satisfeita que a tenha deixado descansar um pouco. Se quer ter mais que uma a trabalhar na enfermaria, então precisa de dar uma secretária a cada uma delas.
        no_desk_2: 'Bom trabalho! Deve ser um recorde mundial: quase um ano completo e não há pacientes! Se desejas continuar a gerir este hospital tens que contratar uma recepcionista e construir uma recepção para receberes os pacientes!'
        no_desk: Constrói uma recepçao e uma recepcionista para começar!
        no_desk_1: Se queres que os pacientes venham ao teu hospital vais precisar de uma recepçao e uma recepcionista!
