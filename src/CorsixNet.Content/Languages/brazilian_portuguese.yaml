      - Esta importante instalaçäo serve para curar um grande número de doenças. A Sala de Cirurgia deve ser espaçosa e estar bem equipada. É uma parte essencial do seu hospital.//
      - 'A Sala de Cirurgia requer dois Médicos especializados em cirurgia. '
