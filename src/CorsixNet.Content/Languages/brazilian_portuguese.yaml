          already_poached_by_someone: Nem pensar! Alguém trate de pescar essa pessoa!
          in_progress: Eu o informarei se esta pessoa deseja trabalhar pra você.
      information:
        emergency: Há uma emergência! Mexa-se! Mexa-se! MEXA-SE!
        handyman_adjust: Você pode fazer com que o Zelador limpe melhor se estabelecer suas prioridades.
        promotion_to_specialist: Um dos seus Médicos foi promovido para %s.
        pay_rise: Um funcionário ameaça se demitir. Você pode atender à sua petiçäo ou demiti-lo. Clique no último ícone da esquerda para ver quem deseja demitir.
        first_death: Acabou de matar seu primeiro paciente. Como se sente?
        fax_received: O ícone que acabou de aparecer no canto inferior esquerdo da tela alerta sobre uma informaçäo importante ou uma decisäo que você precisa tomar.
        promotion_to_consultant: Um dos seus MEDICOS se tornou um CONSULTOR.
        patient_abducted: Os alienígenas raptaram um dos seus pacientes.
        vip_arrived: Cuidado! %s acaba de chegar para visitar o seu hospital! Faça com que tudo funcione bem para lhe agradar.
        extra_items: Os funcionários ficam mais confortáveis e melhoram o seu rendimento se você colocar objetos complementares nas salas.
        epidemic_health_inspector: O Ministério da Saúde soube de que tem uma epidemia. Prepare-se para receber brevemente a visita de um Inspetor de Saúde.
        first_cure: Muito bem! Você acaba de curar seu primeiro paciente.
        epidemic: Há uma doença contagiosa no seu hospital. Você precisa solucioná-la em seguida!
        patient_leaving_too_expensive: Um paciente está indo embora sem pagar %s. Está muito caro.
        place_windows: Se colocar janelas, as salas teräo mais luz e seus funcionários estaräo mais contentes.
        initial_general_advice:
