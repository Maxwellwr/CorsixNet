      - 'A Sala de Treinamento requer um Consultor. '
      toilets:
      - Banheiro//
      - 'Os Pacientes estäo sentindo o chamado da natureza e precisam se aliviar no conforto das suas instalaçöes de banheiro. Você pode construir mais banheiros e pias se esperar muitos visitantes. Em alguns casos, terá que colocar mais banheiros em outras partes do hospital. '
