        roujin_on_cheat: Desafio de Roujin ativado! Boa sorte nos próximos meses...
        roujin_off_cheat: Desafio de Roujin desativado. Tudo voltará ao normal em breve.
        norest_on_cheat: Oh näo! Parece que sua equipe consumiu muita cafeína e näo sente mais necessidade de descansar.
        norest_off_cheat: Ufa! Parece que a agitaçäo finalmente passou. Sua equipe agora descansará adequadamente.
      staff_place_advice:
        not_enough_lecture_chairs: Cada médico estagiário precisa de uma cadeira para assistir às aulas!
        only_psychiatrists: Médicos só podem trabalhar na Psiquiatria se eles tiverem especialidade de Psiquiatra.
        doctors_cannot_work_in_room: Os Médicos näo podem trabalhar em %s.
        only_researchers: Médicos só podem trabalhar no Centro de Pesquisa se tiverem especialidade de Pesquisa.
        nurses_cannot_work_in_room: As Enfermeiras näo podem trabalhar em %s.
        only_surgeons: Médicos só podem trabalhar na Sala de Cirurgia se eles tiverem especialidade de Cirurgiäo
        receptionists_only_at_desk: As Recepcionistas só podem trabalhar na Recepçäo.
        only_doctors_in_room: Apenas Médicos podem trabalhar em %s.
        only_nurses_in_room: Apenas Enfermeiras podem trabalhar na %s.
      earthquake:
        ended: Nossa! Acreditei que ia ser o pior de todos! Alcançou um %d na Escala Richter.
        damage: Por causa do terremoto, há %d máquinas danificadas e %d pessoas feridas no hospital.
        alert: Alerta de terremoto! As suas máquinas podem se danificar durante o terremoto se näo tiverem uma boa manutençäo.
      competitors:
        staff_poached: Um dos seus funcionários recebeu uma boa oferta de trabalho de outro Hospital.
        land_purchased: '%s acaba de comprar terrenos.'
        hospital_opened: '%s, da concorrência, abriu um hospital na área.'
      epidemic:
        hurry_up: Se näo acabar logo com esta epidemia, terá muitos problemas. Aja agora!
        multiple_epidemies: Parece que há mais de uma epidemia ao mesmo tempo. Isso poderia ser desastroso, entäo faça algo rapidamente.
        serious_warning: Esta Doença Contagiosa começa a ser grave. É preciso fazer algo brevemente!
      staff_advice:
