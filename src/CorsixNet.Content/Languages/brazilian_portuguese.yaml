    trophy_room:
      cleanliness:
        award:
        - Os Inspetores notaram que o seu hospital está muito limpo. Um hospital limpo é um hospital seguro. Continue assim.
        regional_good:
        - Seu hospital foi apontado como um dos menos limpos da regiäo. Um hospital sujo, que cheira mal e é perigoso. Você deveria se preocupar mais com a limpeza.
        regional_bad:
        - O seu hospital é o mais sujo da regiäo. Outros diretores conseguiram manter os seus hospitais mais limpos. Você é a vergonha da profissäo médica.
      happy_vips:
        trophies:
        - Você ganhou o Prêmio Nobel de Impressäo de VIPs. Todos que visitaram seu hospital no último ano foram extremamente elogiosos sobre ele.
        - A Agência de Pessoas Famosas também tem o prazer de entregar-lhe o Troféu Celebridade por agradar a todos os VIPs que visitaram sua instituiçäo. Sinta-se um pouco famoso e quase um de nós.
        - Parabéns por conquistar o Prêmio VIAGEM VIP por tornar a vida das figuras públicas mais leve e agradável, agradando todos os que passaram por seu hospital. Maravilhoso.
      gen_repairs:
        awards:
        - Foi-lhe concedido um prêmio especial pela diligência dos seus Zeladores em manter as máquinas do seu hospital em bom estado. Muito bem. Tire umas férias.
        - Os seus Zeladores trabalharam melhor que os de qualquer outro hospital. Este é um importante acontecimento de felicidade.
        - As suas máquinas estäo em um magnífico estado. A dedicaçäo dos seus Zeladores foi extraordinária. Merecem este prestigioso prêmio. Um trabalho estupendo!
        penalty:
        - Os seus Zeladores näo cuidaram bem das suas máquinas. Você deveria fiscalizá-los melhor ou contratar mais para que façam o trabalho melhor.
        - Você näo fez uma boa manutençäo. Os seus funcionários deveriam cuidar melhor dos seus equipamentos.
      many_cured:
        penalty:
        - O seu hospital näo cura com eficácia os Pacientes que necessitam. Tenha mais atençäo às curas para que sejam mais eficazes.
        - O seu hospital é o menos eficaz na hora de curar Pacientes. Decepcionou o Ministério e a si mesmo. Näo diremos mais.
        trophies:
        - Parabéns pelo Prêmio Marie Curie por ter curado quase todos os Pacientes do seu hospital no ano passado.
        - A Fundaçäo Internacional de Curas deseja homenagear o fato de que você curou um grande número de pessoas em seu hospital no ano passado, concedendo a você o Troféu Cura-Muito.
        - Você recebeu o Troféu Paciente Säo por ter conseguido curar em seu hospital uma enorme porcentagem de Pacientes no ano passado.
        awards:
        - Parabéns por curar um montäo de pessoas no ano passado. Um grande número de pessoas se sente muito melhor, graças ao seu trabalho.
        - Pedimos que aceite este prêmio por ter curado mais Pacientes do que qualquer outro hospital. Um excelente trabalho.
        regional:
        - Você recebeu o prêmio de cura total por ter curado mais pessoas do que todos os outros hospitais juntos.
      sold_drinks:
        trophies:
        - A Associaçäo Odontológica orgulhosamente te concede esse Troféu por vender muitas bebidas em seu hospital.
        - Seu hospital foi premiado com o Troféu Negócio-Borbulhante por Vendas de Refrigerantes em reconhecimento ao número de bebidas vendidas em seu hospital no último ano.
        - Em nome da DK Obturaçöes Inc, você recebe este troféu coberto de chocolate para comemorar o extraordinário número de refrigerantes vendidos em seu hospital este ano.
      consistant_rep:
        trophies:
        - O Conselho de Ministros lhe concedeu uma Mençäo de Honra por ter alcançado o nível máximo de eficácia e reputaçäo durante o ano atual. Muito bem.
        - Parabéns pelo Troféu Lençóis Limpos por ser o hospital com a melhor reputaçäo do ano. Você merece.
      cash: DINHEIRO
      high_rep:
        penalty:
        - Você será sancionado pela má reputaçäo que teve no ano passado. Procure melhorar no futuro.
        - A reputaçäo do seu hospital é a pior da área. É uma vergonha. Melhore ou procure outro emprego.
        awards:
        - Muito bem! Ganhou um pequeno prêmio por alcançar uma impressionante reputaçäo no ano passado.
        - Maravilhoso! O seu hospital ganhou um prêmio por conseguir a melhor reputaçäo no ano passado.
        regional:
        - Por favor, aceite o Prêmio Bullfrog por dirigir o melhor hospital do ano. Você merece, aproveite.
        - Este ano, a reputaçäo do seu hospital superou a dos outros hospitais. Um estupendo lucro.
      best_value_hosp:
        trophies:
        - Parabéns pelo Troféu Lençóis Limpos por ser o hospital com a melhor reputaçäo do ano. Você merece.
        regional:
        - Parabéns por ter o hospital mais valioso do jogo. Bom trabalho! Por favor, continue assim.
        penalty:
        - Todos os hospitais da área valem mais do que o seu. Faça algo a respeito desta vergonhosa situaçäo. Consiga coisas mais caras!
      reputation: REPUTAÇAO
      happy_staff:
        regional_good:
        - Os seus funcionários säo os mais satisfeitos de todos os hospitais. Se os funcionários estäo felizes, há mais ganhos e menos mortes. No Ministério estäo satisfeitos.
        penalty:
        - Os seus funcionários desejam que saiba que estäo muito descontentes. Ter bons funcionários é muito proveitoso. Faça com que eles estejam mais satisfeitos ou algum dia irá perdê-los.
        trophies:
        - Ganhou o Troféu Médico Sorridente por manter seus funcionários o mais felizes possível.
        - O Instituto Adami de Felicidade o premia com este troféu por näo ter tido funcionários infelizes no hospital no ano passado.
        - Concedemos a você o Troféu Mais-Sorrisos por manter todos os seus funcionários felizes, além do chamado do dever durante o último ano. Sorrisos por todos os lados!
        awards:
        - Sua equipe lhe concedeu um prêmio. Eles dizem que, em geral, você manda muito bem.
        - Seus funcionários estäo täo felizes trabalhando para você que näo conseguem tirar os sorrisos dos rostos. Você é um gerente magnífico.
        regional_bad:
        - A sua equipe esteve muito infeliz durante o ano passado. Você deveria ter notado. Do jeito que está, as equipes dos outros hospitais estäo muito mais felizes do que a sua.
      hosp_value:
        penalty:
        - O seu hospital fracassou em alcançar um valor razoável. Gerenciou mal o dinheiro. Lembre-se, um bom hospital também é um hospital caro.
        awards:
        - O Ministério da Saúde gostaria de parabenizá-lo pelo impressionante valor alcançado em seu hospital.
        regional:
        - É uma promessa dos negócios. O hospital é o mais valioso de toda a área.
      healthy_plants:
        awards:
        - Parabéns por ganhar o prêmio Grande Fertilizante por manter suas plantas vivas durante o ano passado.
        trophies:
        - Os Amigos das Plantas de Vaso desejam conceder a você o Troféu Verde da Saúde por manter todas as suas plantas em boas condiçöes durante os últimos doze meses.
        - Salvem as Plantas gostaria de presenteá-lo com o Troféu Grande Ecologista por manter vivas as plantas do seu hospital durante o ano passado.
      research:
        penalty:
        - Você foi pouco eficiente ao pesquisar curas, máquinas e medicamentos. Isso é fatal, já que o avanço tecnológico é fundamental.
        regional_good:
        - As suas pesquisas conseguiram colocar o seu hospital entre os últimos avanços de hoje em dia. Os seus pesquisadores merecem este prêmio. Muito bem!
        awards:
        - As suas pesquisas conseguiram colocar o seu hospital entre os últimos avanços de hoje em dia. Os seus pesquisadores merecem este prêmio. Muito bem!
        - No ano passado, descobriu mais remédios e máquinas do que se podia esperar. Por favor, aceite este prêmio de todos nós no Ministério.
        regional_bad:
        - Outros hospitais säo melhores que o seu na pesquisa. No Ministério estäo furiosos, e seu hospital deveria lhe conceder mais importância.
      no_deaths:
        penalty:
        - O número de mortes no seu hospital, no ano passado, foi muito elevado. Preste mais atençäo ao seu trabalho. Assegure-se de que no futuro mais pessoas sobrevivam.
        - O seu hospital é um risco para os Pacientes. Supöe-se que você deve curar muitas pessoas, näo deixá-las morrer.
        trophies:
        - Você ganhou o Prêmio Ausência de Reclamaçöes por manter 100%% de seus Pacientes vivos no último ano.
        - Associaçäo A Vida Continua entrega-lhe este troféu por näo ter registrado nenhum óbito no último ano.
        - Você foi premiado com o Troféu Fique Vivo por evitar qualquer morte em seu excelente hospital neste ano. Ótimo.
        awards:
        - Ganhou este prêmio como reconhecimento ao seu baixo índice de falecimentos no seu hospital, este ano. É estupendo!
        - A sua habilidade conseguiu reduzir ao mínimo o número de mortes no seu hospital. Deve estar muito feliz com este resultado.
        regional:
        - No ano passado, a taxa de mortalidade do seu hospital foi inferior à dos outros. Por favor, aceite este prêmio.
      rats_accuracy:
        trophies:
        - Você recebeu o Troféu Syndicate Wars, Tiro Preciso por acertar em %d%% dos ratos em seu hospital no ano passado.
        - Este prêmio é para celebrar a sua incrível pontaria ao eliminar %d%% dos ratos que disparou em seu hospital no ano passado.
        - Para celebrar o fato de que eliminou %d%% dos ratos do seu hospital, foi-lhe concedido o Troféu Dungeon Keeper, Livre de Roedores. CongRATulaçöes!
      emergencies:
        penalty:
        - Você foi muito pouco eficiente nos casos de emergência. Os Pacientes de emergência merecem uma atençäo rápida e precisa, que você näo lhes deu.
        award:
        - Parabéns! Ganhou este prêmio pela maneira eficaz e eficiente com que solucionou as emergências. Bom trabalho.
        - Confrontou as emergências de uma maneira extraordinária. Ganhou este prêmio por ser o melhor na hora de lidar com uma grande quantidade de Pacientes.
        regional_good:
        - O Ministério reconhece que no ano passado, no seu hospital, você tratou as emergências melhor do que qualquer outro hospital, entäo lhe concedeu este prêmio.
        regional_bad:
        - O seu hospital é o pior da regiäo para tratar casos de emergência. Você é responsável por ocupar o último lugar na Liga Local de Tratamentos de Emergência.
      curesvdeaths:
        awards:
        - Os meus mais sinceros parabéns. No ano passado, o número de curas foi superior ao de falecimentos no seu hospital.
        penalty:
        - A sua proporçäo entre curas e mortes é extremamente baixa. Deveria assegurar-se de que cura mais pessoas do que mata. Näo deixe os seus funcionários em má posiçäo.
      wait_times:
        award:
        - Parabéns! No seu hospital, a espera dos Pacientes foi muito curta. Este é um acontecimento importante.
        penalty:
        - No seu hospital, os Pacientes esperam muito tempo. Há sempre filas inaceitáveis. Você poderia tratar os seus Pacientes com mais eficácia se quisesse.
      happy_patients:
        awards:
        - Deve estar orgulhoso de que, no ano passado, as pessoas estavam muito contentes no seu hospital.
        - Os Pacientes que visitaram o seu hospital sentiram-se mais satisfeitos com o seu tratamento do que nos outros hospitais.
        penalty:
        - As pessoas que väo ao hospital têm uma experiência terrível. Você terá que fazê-lo muito melhor se quiser ganhar o respeito do Ministério.
        - As pessoas que receberam tratamento no seu hospital queixaram-se do estado do mesmo. Deveria ter muito mais em conta o bem-estar dos Pacientes.
      pop_percentage:
        awards:
        - Note que, no ano passado, curou uma grande parte da populaçäo local no seu hospital. Muito bem.
        - Parabéns! A maioria da populaçäo local vai ao seu hospital em vez de ir a qualquer outra instituiçäo.
        - Brilhante! O seu hospital recebeu o maior número de Pacientes que todos os outros hospitais juntos.
        penalty:
        - Teve muito poucos Pacientes este ano. Para ganhar dinheiro, precisa que haja Pacientes que paguem.
        - Todos os hospitais da área conseguiram mais Pacientes do que você. Deveria estar envergonhado.
      rats_killed:
        trophies:
        - Você recebeu o Troféu Raticida por eliminar %s ratos em seu hospital no ano passado.
        - Você merece este prêmio da Federaçäo Anti Ratos pela sua excepcional habilidade em eliminar ratos, demonstrada ao eliminar %s exemplares.
        - Você recebeu o Troféu Acaba com Ratos pela sua grande habilidade em eliminar %d ratos em seu hospital no ano passado.
      all_cured:
        awards:
        - Parabéns por ganhar o Prêmio Marie Curie por curar todos os Pacientes do seu hospital no ano passado.
        trophies:
        - A Fundaçäo Internacional de Cura deseja homenageá-lo por curar todos os Pacientes em seu hospital no último ano, concedendo a você o Troféu Cura-Tudo.
        - Você recebeu o Troféu Paciente Sem-Doença por conseguir curar todos os Pacientes em seu hospital no último ano.
