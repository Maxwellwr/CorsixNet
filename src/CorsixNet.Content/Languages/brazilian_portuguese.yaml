      - 'O Centro de Pesquisa requer um Médico especializado em Pesquisa. '
      general_diag:
      - Diagnóstico Geral//
      - Aqui säo examinados os Pacientes que precisam de outro diagnóstico. Se um Consultório de Clínica Geral näo descobrir seus problemas, o Diagnóstico Geral normalmente consegue. Em seguida, os Pacientes säo enviados novamente para a consulta para analisar os resultados obtidos aqui.//
      - 'A Sala de Diagnóstico Geral requer um Médico. '
      scanner:
      - Scanner//
      - Os Pacientes säo diagnosticados com precisäo utilizando um sofisticado Scanner. Em seguida, väo para o Consultório de Clínica Geral para que o Médico veja o tratamento posterior.//
      - 'O Scanner requer um Médico. Também precisa de manutençäo. '
      electrolysis:
      - Eletrólise//
      - Os Pacientes com Peludismo säo enviados para esta sala, onde uma máquina especial de Eletrólise elimina os pelos e fecha os poros com eletricidade empregando um composto parecido ao cal.//
      - 'A Sala de Eletrólise requer um Médico. Também precisa que um Zelador faça a sua manutençäo. '
