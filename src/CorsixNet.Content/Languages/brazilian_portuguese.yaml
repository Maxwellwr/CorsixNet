        need_handyman_litter: Os pacientes estäo sujando seu hospital. Contrate um Zelador para se encarregar da limpeza.
        need_nurses: Contrate mais Enfermeiras. Na Enfermaria e na Farmácia faltam Enfermeiras.
        need_doctors: Você precisa de mais Médicos. Tente colocar os seus melhores Médicos nas salas com mais Pacientes.
        too_many_doctors: Você tem muitos Médicos. Alguns estäo desocupados neste momento.
        need_handyman_machines: Você terá que contratar um Zelador se quiser que as máquinas do seu hospital funcionem.
        need_handyman_plants: Você vai precisar contratar um Zelador para regar as plantas.
