      psych:
      - Psiquiatria//
      - Os Pacientes diagnosticados com uma doença psiquiátrica devem ir à Psiquiatria para receber tratamento. Os psiquiatras também podem realizar diagnósticos para saber que tipo de doença os Pacientes sofrem e, se forem do tipo mental, podem tratá-los fazendo-os deitar em um divä.//
      - 'A Psiquiatria requer um Médico especializado em Psiquiatria. '
      operating_theatre:
