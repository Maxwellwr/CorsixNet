    letter:
      9:
        2: Você provou ser o melhor administrador de hospitais na longa e conturbada história da medicina. Tal conquista monumental näo pode passar despercebida, entäo gostaríamos de oferecer-lhe o cargo honorário de Chefe Supremo de Todos os Hospitais. Isso vem com um salário de $%d. Você será recebido com uma parada em sua homenagem, e as pessoas demonstraräo sua gratidäo por onde quer que vá.//
        1: Caro %s//
        3: Agradecemos por tudo o que fez e desfrute de uma longa semi-aposentadoria.//
        4: ''
      10:
        2: Parabéns por administrar com sucesso todos os hospitais que lhe foram designados. Tal desempenho magnífico lhe qualifica para a liberdade de todas as cidades do mundo. Você receberá uma pensäo de $%d, e tudo o que pedimos é que viaje, gratuitamente, por todo o país, promovendo o trabalho de todos os hospitais ao seu público adorador.//
        1: Caro %s//
        3: Estamos orgulhosos e agradecidos pelo seu trabalho ao salvar vidas.//
        4: Ei! Você está indo à falência!
      11:
        2: Sua carreira foi exemplar, e você é uma inspiraçäo para todos nós. Obrigado por administrar tantos hospitais com tanta competência. Gostaríamos de lhe conceder um salário vitalício de $%d, e simplesmente pedir que viaje em um carro oficial aberto de cidade em cidade, proferindo palestras sobre como alcançou tanto sucesso em täo pouco tempo.//
        3: Você é um exemplo para todas as pessoas sábias, e sem exceçäo, todos no mundo o(a) consideram um ativo supremo.//
        1: Caro %s//
        4: Ei! Você está indo à falência!
      12:
        2: Sua carreira de sucesso como o melhor administrador de hospitais desde Moisés está chegando ao fim. Condizente com seu impacto na naçäo, o Ministério gostaria de lhe oferecer um salário de $%d apenas para aparecer em nosso nome, inaugurando eventos, lançando navios e participando de programas de entrevistas. Seria uma ótima PR para todos nós!//
        1: Caro %s//
        3: Por favor, aceite. Será fácil e você terá um veículo e uma escolta policial.//
        4: Ei! Você está indo à falência!
      dear_player: >
        Prezado(a) %s
      custom_level_completed: Parabéns! Você completou todos os objetivos desta fase personalizada!
      return_to_main_menu: Deseja retornar ao menu principal ou continuar jogando?
      campaign_level_completed: >-
        Bom trabalho! Você superou este nível, mas ainda näo acabou!
         Você se interessaria em aceitar um posto no hospital %s?
      campaign_completed: Incrível! Você conseguiu superar todos os níveis. Já pode relaxar e desfrutar enquanto fala das suas realizaçöes nos fóruns de toda a Internet. Boa sorte!
      campaign_level_missing: 'Desculpe, parece que o próximo nível desta campanha está faltando. (Nome: %s)'
      1:
      - Caro %s//
      - Fantástico! Dirigiu este hospital de uma maneira excelente. Nós, a elite do Ministério da Saúde, gostaríamos de saber se você estaria interessado em fazer parte de um grande projeto. Há um trabalho para o qual acreditamos que você seria a pessoa perfeita. O salário seria de $%d. Pense nisso.//
      - Você está interessado em trabalhar no Hospital %s?
      2:
      - Caro %s//
      - Parabéns! Realizou notáveis melhorias no seu hospital. Temos outro serviço que você poderia assumir, se gostar de mudanças e novos desafios. Näo é obrigatório aceitar, mas seria bom se o fizesse. O salário é de $%d.//
      - Você está interessado em trabalhar no Hospital %s?
      3:
      - Caro %s//
      - Dirigiu este hospital com notável desempenho durante o seu mandato. Ao chegar ao fim, prevejo um brilhante futuro, e gostaríamos de lhe oferecer um cargo em outro lugar. O salário seria de %d, e acredito que você adoraria o desafio que isso criaria.//
      - Gostaria de ter um posto no Hospital %s?
      4:
      - Caro %s//
      - Parabéns! No Ministério estamos muito impressionados com sua capacidade como diretor do Hospital. É, sem dúvida, uma pessoa valiosa para o Departamento de Saúde, mas acreditamos que você preferiria um trabalho mais qualificado. Receberia um salário de $%d, embora a decisäo seja sua.//
      - Você está interessado em trabalhar no Hospital %s?
      5:
      - Caro %s//
      - Saudaçöes novamente. Respeitamos o seu desejo de näo querer sair do seu estupendo hospital, mas pedimos que reconsidere. Ofereceremos a você um alto salário de $%d se decidir ir para o outro hospital e assumir a sua direçäo.//
      - Gostaria de ir agora para o Hospital %s?
      6:
      - Caro %s//
      - Receba nossas saudaçöes. Sabemos que você desfrutou muito da sua estadia nesta instituiçäo, täo agradável e bem dirigida, mas acreditamos que agora deveria pensar no seu futuro. Naturalmente, você teria um salário de $%d se decidisse sair. Vale a pena considerar.//
      - Gostaria de ter um posto no Hospital %s?
      7:
      - Caro %s//
      - Bom dia! O Ministério da Saúde gostaria de saber se você reconsideraria a sua decisäo de ficar no seu hospital. Compreendemos que você tenha um ótimo hospital, mas acreditamos que faria muito bem em aceitar um trabalho mais estimulante, com um salário de $%d.//
      - Aceitaria um posto no Hospital %s?
      8:
      - Caro %s//
      - Olá, novamente. Recebemos a sua resposta negativa na nossa última carta, na qual oferecíamos um posto de direçäo em outro hospital, com um alto salário de $%d. Contudo, acreditamos que você deveria reconsiderar essa decisäo. Como verá, temos o trabalho perfeito para você.//
      - Aceitaria um posto no Hospital %s, por favor?
