          epidemic_spreading: Há uma doença contagiosa no seu hospital. Tente curar as pessoas infectadas antes que elas possam ir embora.
          research_now_available: Você construiu seu primeiro centro de pesquisa. Agora pode acessar a tela de pesquisa.
          autopsy_available: Foi inventada uma máquina de autópsia. Com ela, você poderá se livrar dos Pacientes problemáticos e investigar seus restos. Tome cuidado, o uso desta máquina suscita muita polêmica.
          rats_have_arrived: Os ratos invadiram seu hospital. Tente eliminá-los com o mouse.
          surgeon_symbol: 'Os Médicos especializados em cirurgia levam o símbolo: {'
          machine_needs_repair: Há uma máquina que precisa ser reparada. Encontre a máquina e clique sobre ela. Em seguida, clique no botäo do Zelador.
          research_symbol: 'Os Médicos pesquisadores levam o símbolo: }'
          decrease_heating: As pessoas estäo com muito calor no seu hospital. Diminua o aquecimento. Isso é feito na tela do mapa da cidade.
          taking_your_staff: Alguém está subornando sua equipe. Você terá que discutir com eles para que fiquem.
          first_VIP: Você vai receber seu primeiro visitante VIP. Certifique-se de que o VIP näo veja nada sujo nem nenhum Paciente descontente.
          increase_heating: As pessoas estäo com frio. Ligue o aquecimento na tela do mapa da cidade.
          psychiatric_symbol: 'Os Médicos especializados em psiquiatria levam o símbolo: |'
          first_epidemic: Há uma epidemia no seu hospital! Decida se quer tratá-la ou liberá-la.
          place_radiators: As pessoas estäo com frio no seu hospital. Você pode colocar mais Aquecedores selecionando-os no menu de mobiliário do corredor.
          first_emergency: Os Pacientes de emergência têm uma luz azul piscando sobre suas cabeças. Cure-os antes que morram ou que o tempo limite se esgote.
        promotion_to_doctor: Um dos seus RESIDENTES se tornou um MEDICO.
        larger_rooms: Se fizer salas espaçosas, seus funcionários se sentiräo mais importantes e melhoraräo o seu rendimento.
      build_advice:
        door_not_reachable: As pessoas näo poderäo passar por essa porta. Pense sobre isto.
        blueprint_would_block: Esse projeto iria bloquear outras salas. Tente alterar o tamanho ou coloque em outro local!
        placing_object_blocks_door: Se colocar este objeto aí, impedirá que se possa acessar alguma porta.
        blueprint_invalid: Esse näo é um projeto válido.
      level_progress:
