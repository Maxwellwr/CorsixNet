      - Estou muito cansado. Preciso de férias e de um aumento salarial de %d, totalizando %d. E quero já, seu tirano!
      - Vamos! Trabalho como um escravo. Se me der um bônus de %d, ficarei no seu hospital.
      - Estou muito insatisfeito. Exijo um aumento de %d, totalizando um salário final de %d; caso contrário, vou embora.
      - Meus pais me disseram que os Médicos ganham um bom salário; entäo, me dê um aumento de %d ou me dedicarei à produçäo de jogos de computador.
      - Estou farto. Pague-me um bom salário. Um aumento de %d será suficiente.
      definite_quit: Nada que você faça me manterá aqui. Estou farto deste lugar.
      poached: '%s me ofereceu um salário de %d. Se näo me pagar o mesmo, vou embora.'
    introduction_texts:
      level17: Um último aviso.  Fique de olho na sua Reputaçäo, é o que atrairá pacientes ao seu estabelecimento.  Se näo matar muitas pessoas e as mantiver razoavelmente felizes näo deverá ter muitos problemas com este nível!//Agora é com você, boa sorte.
      level11: Tem a oportunidade de construir o hospital definitivo.  Esta é uma área de enorme prestígio e o Ministério quer que este seja o melhor hospital.  Esperamos que ganhe muito dinheiro, alcance uma excelente reputaçäo e que se encarregue de todos os casos que sejam apresentados.  Este é um trabalho importante.  Terá que ser muito hábil para completá-lo.  Também deve ter em conta que foram vistos OVNIs na área.  Assegure-se de que os seus funcionários estejam preparados para receber algumas visitas inesperadas.  O seu hospital terá que alcançar um valor de $240.000, precisará ter $500.000 no banco e uma reputaçäo de 700.
      level9: Depois de depositar o dinheiro na conta bancária do Ministério e pagar uma nova limousine para o Ministro, agora pode dedicar a criar um bom hospital para cuidar dos doentes e necessitados.  Aqui terá um montäo de problemas diferentes.  Se os seus funcionários tiverem uma boa formaçäo e suficientes consultas, poderäo resolver qualquer situaçäo.  O seu hospital terá que valer $200.000 e precisará ter $400.000 no banco.  Se näo o conseguir näo poderá terminar o nível.
      level16: Uma vez que tenha diagnosticado algum dos pacientes, precisará construir salas de tratamento e clínicas para curá-los.  Pode começar com uma Farmácia, onde precisará de uma Enfermeira que distribua os remédios.
      level10: Além de dever curar todas as doenças que possa haver, o Ministério pede que empregue um pouco de tempo em aumentar a eficácia dos seus remédios.//Houve algumas queixas por parte do D. Salutíssimo, o Cachorro Guardiäo da Saúde, assim deve procurar com que todos os seus remédios sejam extremamente eficazes para ficar bem.  Também, assegure-se de que o seu hospital tenha uma reputaçäo irrepreensível.  Procure deixar morrer poucos pacientes.  Como sugestäo, deveria deixar espaço para um banho gelatinoso.  Para ganhar, os seus remédios deveräo ter uma eficácia de, pelo menos, 80%, tem que conseguir uma reputaçäo de 650 e guardar $500.000 no banco.
      level12: Agora enfrentará o maior dos desafios.  Impressionado com os seus lucros, o Ministério tem uma grande tarefa para você; querem que construa outro magnífico hospital, que tenha um excelente lucro e uma reputaçäo incrível.  Também querem que compre todo o terreno que puder, cure tudo (e queremos dizer todas as doenças) e ganhe todos os prêmios.  Acha que conseguirá?  Ganhe $650.000, cure 750 pessoas e consiga uma reputaçäo de 800 para ganhar este nível.
      level15: Bem, estes säo os mecanismos básicos para pôr em funcionamento um hospital.//Os seus Médicos väo precisar de toda a ajuda que possam obter para diagnosticar alguns dos pacientes.  Pode ajudá-los construindo outros equipamentos de diagnóstico como a sala de Diagnóstico Geral.
      level2: 'Há uma grande variedade de doenças nesta área. Prepare o seu hospital para tratar mais pacientes e para a construçäo de um Centro de Pesquisa. Lembre-se que deve manter limpo o hospital e procurar atingir a sua mais alta reputaçäo possível. Tratará doenças como a língua comprida, entäo necessitará de uma sala de laringologia. Também pode construir uma cardiologia para diagnosticar novas doenças. Estas duas consultas deveräo ser pesquisadas antes de as construir. Também pode comprar mais terreno para aumentar o seu hospital. Para isso, utilize o mapa da cidade. Obtenha uma reputaçäo de 300 um saldo de bancário de $10,000 e 40 pessoas curadas. '
      demo: Bem-vindo ao hospital de demonstraçäo!//Infelizmente esta versäo de demonstraçäo só possui esta fase. Entretanto, teremos aqui o suficiente para mantê-lo ocupado por enquanto! Você encontrará várias doenças que necessitaräo de salas diferentes para cura. De tempos em tempos, emergências ocorreräo. E você precisará pesquisar por salas adicionais usando o Centro de Pesquisas. Seu objetivo é ter um saldo bancário de $100.000,00, o valor do hospital em $ 70.000,00 e uma reputaçäo de 700, enquanto você cura pelo menos 75% de seus pacientes. Certifique-se que sua reputaçäo näo fique abaixo de 300 e você näo mate mais de 40% dos seus pacientes, senäo você perde.//Boa sorte!
      level6: ' Use todo o seu conhecimento para montar um hospital eficiente e bem administrado que gere um lucro saudável e consiga lidar com qualquer coisa que o público doente possa trazer. Você precisará estar ciente de que o ambiente, aqui, é especialmente propenso a germes e infecçöes. A menos que mantenha uma escrupulosa limpeza na sua instituiçäo, terá que fazer frente a uma série de epidemias entre os Pacientes. Procure obter um lucro de $20.000 e fazer o valor do seu hospital superar os $140.000.'
      level3: ' Desta vez, você colocará o seu hospital em uma área rica. O Ministério da Saúde espera que você consiga curar muitos Pacientes. Você terá que ganhar uma boa reputaçäo para começar, mas uma vez que o hospital comece a funcionar, concentre-se em ganhar todo o dinheiro que puder. Também podem haver Emergências. Elas ocorrem quando chega muita gente que sofre da mesma doença. Se você os curar dentro de um prazo determinado, conseguirá aumentar a sua reputaçäo e ganhar um grande extra. Haverá doenças, como o Complexo de Rei, e você deverá ter orçamento para construir uma Sala de Cirurgia e, junto a ela, uma Enfermaria. Você tem que ganhar $20.000 para superar este nível.'
      level14: ' Ainda tem mais um desafio: um hospital surpresa totalmente imprevisível. Se conseguir ter êxito, será o vencedor dos vencedores. E näo espere que seja fácil, porque é a tarefa mais difícil que você enfrentará. Boa sorte!'
      level5: ' Este será um Hospital movimentado, lidando com uma ampla variedade de casos. Os seus Médicos acabaram de sair da faculdade, por isso é fundamental que construa uma Sala de Treinamento para que alcancem o nível de formaçäo necessário. Você só tem três Consultores para ajudar a ensinar sua equipe inexperiente, entäo mantenha-os felizes. Você deve ter em mente que o hospital está localizado sobre a falha geológica de San Android. Sempre há risco de terremoto. Os terremotos provocaräo danos importantes nas suas máquinas e alteraräo o bom funcionamento do seu hospital. Aumente a sua reputaçäo até 400 e consiga ganhos de $50.000 para triunfar. Além disso, cure 200 Pacientes.'
      level1: ' Bem-vindo ao seu primeiro Hospital!// Para fazê-lo funcionar, coloque uma Recepçäo, construa um Consultório de Clínica Geral e contrate uma Recepcionista e um Médico. Em seguida, espere que cheguem os Pacientes. Seria uma boa ideia construir uma Psiquiatria e contratar um Psiquiatra. Uma Farmácia e uma Enfermeira säo essenciais para curar os seus Pacientes. Cuidado com os casos malignos de Cabeça Inflada; eles säo solucionados na sala de Inflatoterapia. Você terá que curar 10 pessoas e garantir que a sua reputaçäo näo seja inferior a 200.'
      level7: ' Aqui, você estará sob a estrita vigilância do Ministério da Saúde, entäo faça com que suas contas reflitam excelentes lucros e aumente a sua reputaçäo. Näo podemos permitir que haja mortes desnecessárias; isso näo beneficia o negócio. Certifique-se de que os seus funcionários estejam em excelente forma e que você tenha todo o equipamento necessário. Obtenha uma reputaçäo de 600 e um saldo bancário de $200.000.'
      level4: ' Mantenha seus Pacientes felizes e trate-os com a maior eficácia possível, reduzindo ao máximo o número de óbitos. A sua reputaçäo está em jogo, entäo procure aumentá-la o máximo que puder. Näo se preocupe muito com o dinheiro; você irá ganhando à medida que cresce a sua reputaçäo. Também poderá treinar seus Médicos para ampliar suas conhecimentos. Eles poderäo curar os Pacientes mais difíceis. Alcance uma reputaçäo acima de 500.'
      level18: Ei! Você está indo à falência!
      level13: ' A sua incrível habilidade como diretor do hospital atraiu a atençäo da Divisäo Secreta Especial do Serviço Secreto Especial. Tenho um trabalho especial para você. Há um hospital infestado de ratos que precisa de um exterminador eficiente. Você deve matar todos os ratos que puder antes que o pessoal de Manutençäo limpe toda a sujeira. Acha que é apto para esta missäo?'
      level8: ' Cabe a você montar o hospital mais rentável e eficiente possível. As pessoas por aqui säo bastante ricas, entäo tente arrecadar o máximo possível. Lembre-se de que curar as pessoas é uma coisa muito bonita, mas o que PRECISAMOS de verdade é do dinheiro delas. Arranque todo o dinheiro dessas pessoas doentes. Acumule a enorme quantia de $300.000 para completar este nível.'
    level_progress:
      hospital_value_enough: Mantenha o valor do seu hospital acima de %d e atenda os seus outros problemas para ganhar o nível.
      cured_enough_patients: Curou muitos pacientes, mas precisa manter o seu hospital em melhor estado para ganhar o nível.
