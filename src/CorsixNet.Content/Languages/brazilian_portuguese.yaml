        need_surgeon_ward: Você precisa contratar outro Cirurgiäo e construir uma Enfermaria para poder realizar operaçöes.
      multiplayer:
        objective_completed: Você completou o objetivo. Parabéns!
        objective_failed: Você falhou em completar o objetivo.
        everyone_failed: Ninguém conseguiu cumprir o último objetivo. Entäo, todos continuam jogando.
