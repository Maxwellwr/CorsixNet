      - Os Pacientes que estiveram expostos à radiaçäo säo enviados rapidamente à Sala de Descontaminaçäo. Esta sala dispöe de uma ducha que os purifica de toda a horrível radioatividade e sujeira.//
      - 'A Ducha Descontaminadora requer um Médico. Ela também precisa de um Zelador que se ocupe da manutençäo. '
      jelly_vat:
      - Banho Gelatinoso//
      - Os Pacientes que sofrem da risível doença da Gelatinite devem ir a cambalear-se para a sala de Gelatinite e ser inundados no banheiro gelatinoso. Isto faz com que se curem de um modo que näo resulta de tudo compreensível para a profissäo médica.//
      - 'O Banho Gelatinoso requer um Médico. Também precisa de um Zelador para a sua manutençäo. '
      gp:
      - Consultório de Clínica Geral//
      - Esta é a sala mais importante do seu hospital. Os novos Pacientes säo enviados aqui para averiguar o que têm. Entäo, ou fazem outro diagnóstico ou säo encaminhados para uma sala onde possam ser curados. Possivelmente, você queira construir outro consultório se o primeiro tiver muito trabalho. Quanto maior for o consultório e quanto mais objetos colocar nele, maior prestígio terá o Médico. O mesmo acontece com todas as salas ocupadas.//
      - 'O Consultório de Clínica Geral requer um Médico. '
      hair_restoration:
      - Pêloterapia//
      - Os Pacientes que sofrem de Calvície seräo enviados ao Restaurador de Pêlo desta sala. Um Médico ligará o Restaurador de Pêlo, que rapidamente implantará ar puro na cabeça do Paciente.//
