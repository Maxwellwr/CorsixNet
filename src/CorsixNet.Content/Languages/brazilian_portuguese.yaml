steps:
- inherit: English
- strings:
    adviser:
      warnings:
        money_low: Você está ficando sem dinheiro!
        no_desk: Você precisa comprar um balcäo de recepçäo e contratar uma recepcionista em algum momento!
        no_desk_1: Se você quer que os pacientes venham ao seu hospital, você precisa contratar uma recepcionista e comprar um balcäo para recepcioná-los!
        no_desk_2: Excelente, isso provavelmente é um recorde mundial - quase um ano e nenhum paciente! Se você deseja continuar administrando este hospital, você precisa urgente contratar uma recepcionista e comprar um balcäo para que ela possa trabalhar!
        no_desk_3: Brilhante, se passou quase um ano e ainda näo tem uma recepcionista! Como quer que os pacientes apareçam? Arrume uma recepcionista e deixe de perder tempo!
        no_desk_4: Uma recepcionista necessita de uma mesa para atender os pacientes que aparecem.
        no_desk_5: Já era hora! Os pacientes começaräo a chegar logo.
        no_desk_6: Você tem uma recepcionista, que tal se construir uma mesa de recepçäo para que possa trabalhar?
        no_desk_7: Você construiu a mesa da recepçäo, entäo que tal contratar um recepcionista?  Você näo receberá nenhum paciente até que contrate uma.
        another_desk: Você precisará construir outra mesa para essa nova recepcionista.
        cannot_buy: Você näo pode comprar mais desse item!
        cannot_afford: Você näo tem dinheiro suficiente no banco para contratar essa pessoa!
        cannot_afford_2: Você näo tem dinheiro suficiente no banco para fazer essa compra!
        cannot_afford_machine: Você precisa de pelo menos $%1% no banco para comprar um novo %2%!
        falling_1: Ei! Isso näo é engraçado, cuidado onde aponta este mouse; alguém pode se machucar!
        falling_2: Gostou da queda? Pare de bagunçar!
        falling_3: Ai, isso dói, alguém chame um médico!
        falling_4: Isto é um Hospital, näo um parque de diversöes!
        falling_5: Este näo é o local para empurrar as pessoas, elas estäo doentes sabia?
        falling_6: Aqui näo é uma pista de boliche, pessoas doentes näo deveriam ser tratadas desta forma!
        research_screen_open_1: Para acessar a tela de pesquisa, tem que construir um Centro de Pesquisa.
        research_screen_open_2: Näo é possível realizar pesquisas nessa fase.
        researcher_needs_desk_1: Uma pesquisa necessita de uma mesa para trabalhar.
        researcher_needs_desk_2: Seu pesquisador agradece que lhe tenha dado um descanso. Se pretende ter mais pessoas pesquisando, deve dar a cada um uma mesa para trabalhar.
        researcher_needs_desk_3: Cada pesquisa necessita de uma mesa para trabalhar.
        nurse_needs_desk_1: Cada enfermeira necessita de uma mesa para trabalhar.
        nurse_needs_desk_2: Sua enfermeira agradece que lhe tenha dado um descanso. Se pretende ter mais pessoas trabalhando na Enfermaria, tem que dar a cada uma delas uma mesa para trabalhar.
        low_prices: Você está cobrando muito pouco pelo uso de %s. Isto trará pessoas para o seu hospital, mas você näo fará muito lucro com cada uma delas.
        high_prices: Você está cobrando muito pelo uso de %s. Isto trará grande lucro a curto prazo, mas no final das contas você começará a afugentar as pessoas para longe do seu hospital.
        fair_prices: Seus preços de %s parecem justos e equilibrados.
        patient_not_paying: Um paciente saiu sem pagar por %s porque está muito caro!
        patients_unhappy: Os pacientes näo gostam do seu hospital. Você deveria fazer algo para melhorá-lo.
        too_much_litter: Há um problema de limpeza. Mais Zeladores podem ser a soluçäo.
        patients_very_thirsty: Os Pacientes estäo com muita sede. Se näo colocar logo algumas máquinas de bebidas, as pessoas iräo embora do seu hospital para tomar um refresco.
        queue_too_long_at_reception: Muitos pacientes estäo à espera na recepçäo. Coloque outra Recepçäo e contrate outra Recepcionista.
        patients_thirsty: As pessoas estäo começando a ter sede. Talvez você devesse colocar máquinas de bebidas.
        nurses_tired: As suas Enfermeiras estäo cansadas. Mande-as descansar agora mesmo.
        patients_too_hot: Os pacientes estäo com muito calor. Retire alguns Aquecedores, baixe a temperatura ou coloque mais máquinas de bebidas.
        patients_thirsty2: As pessoas estäo reclamando que têm sede. Você deveria colocar mais máquinas de bebidas ou aproximar as que já existem.
        machines_falling_apart: Suas máquinas estäo caindo aos pedaços. Chame um Zelador para que as reparem.
        financial_trouble3: Seu saldo tem um aspecto preocupante. Faça algo efetivo. Você está a %d do desastre.
        nurses_tired2: As suas Enfermeiras estäo muito cansadas. Faça-as descansar agora mesmo.
        people_have_to_stand: Há Pacientes em pé. Faça-os sentar já!
        handymen_tired: Os seus Zeladores estäo muito cansados. Mande-os descansar agora mesmo.
        change_priorities_to_plants: Você tem que alterar as prioridades dos seus Zeladores para que empreguem mais tempo regando as plantas.
        staff_tired: Seus funcionários estäo incrivelmente cansados. Se näo os deixar descansar um momento em uma Sala de Descanso, alguns poderäo sofrer de esgotamento.
        some_litter: Os Zeladores podem recolher todo esse lixo antes que se torne um problema sério.
        cash_low_consider_loan: Seu saldo está muito baixo. Já pensou em solicitar um empréstimo?
        reduce_staff_rest_threshold: Tente alterar o Tempo de Descanso dos funcionários na tela de Políticas para que possam descansar mais frequentemente. É só uma sugestäo.
        build_staffroom: Construa uma Sala de Descanso o mais rápido possível. Seus funcionários trabalham muito e estäo à beira do colapso. Vamos, seja razoável!
        many_epidemics: Parece que há mais de uma epidemia ao mesmo tempo. Isso poderia ser desastroso, entäo faça algo rapidamente.
        build_toilets: Construa um Banheiro agora mesmo ou verá algo muito desagradável. E você pode imaginar como cheirará o seu hospital.
        staff_overworked: Os seus funcionários têm muito trabalho. Eles estäo perdendo eficácia e väo começar a cometer erros desastrosos.
        doctors_tired2: Os seus Médicos estäo cansadíssimos. Precisam descansar imediatamente.
        queues_too_long: As filas estäo muito longas.
        staff_unhappy: Seus funcionários estäo descontentes. Dê a eles um pagamento extra ou, ainda melhor, construa uma Sala de Descanso para eles. Você também pode alterar sua política de descanso dos funcionários na tela de Política.
        patient_leaving: Há um Paciente indo embora. A causa? A má gestäo e a péssima qualidade dos seus funcionários e equipamentos.
        patient_stuck: Alguém ficou bloqueado. Planeje melhor seu hospital.
        receptionists_tired: As suas Recepcionistas estäo extenuadas. Mande-as descansar agora mesmo.
        charges_too_low: Você está cobrando muito pouco. Isso irá trazer as pessoas para o hospital, mas os lucros seräo muito baixos.
        epidemic_getting_serious: Esta Doença Contagiosa começa a ser grave. É preciso fazer algo brevemente!
        patients_really_thirsty: Os Pacientes têm muita sede. Coloque mais máquinas de bebidas ou aproxime as existentes das filas mais longas.
        patients_annoyed: As pessoas estäo extremamente insatisfeitas com a forma como você dirige seu hospital. E näo pode alegar que näo têm razäo. Resolva o problema ou enfrente as consequências!
        place_plants3: Os Pacientes estäo descontentes. Coloque mais plantas para animá-los.
        machinery_deteriorating: Suas máquinas começam a se deteriorar por uso excessivo. Vigie-as.
        place_plants4: Alegre os Pacientes colocando mais plantas.
        money_very_low_take_loan: O seu Saldo Bancário é muito baixo. Você poderia pedir um empréstimo.
        finanical_trouble2: Consiga algum crédito ou estará acabado. Perderá o nível se perder outros %d.
        patients_very_cold: Os Pacientes estäo com muito frio. Aumente o aquecimento ou coloque mais Aquecedores no seu hospital.
        deal_with_epidemic_now: Se näo acabar logo com esta epidemia, terá muitos problemas. Aja agora!
        litter_catastrophy: O problema da falta de limpeza é grave. Coloque vários Zelador para trabalhar agora mesmo!
        litter_everywhere: Há sujeira por toda parte. Coloque mais Zelador para trabalhar.
        machinery_slightly_damaged: A maquinaria do seu hospital está um pouco danificada. Näo se esqueça de repará-las.
        patients_getting_hot: Os Pacientes estäo com muito calor. Baixe o aquecimento ou retire alguns Aquecedores.
        no_patients_last_month: Nenhum novo paciente veio ao seu hospital mês passado. Horrível!
        many_killed: Você matou %d pacientes. Acho que precisa melhorar, näo?
        build_toilet_now: Construa já alguns Banheiros. As pessoas näo aguentam mais. Näo se ria, é grave.
        people_freezing: Que horrível! Nesta era de aquecimento central, alguns dos seus Pacientes estäo se congelando. Coloque Aquecedores para aquecê-los e aumente o aquecimento.
        place_plants_to_keep_people: As pessoas estäo indo embora. Se colocasse mais plantas, poderia convencê-las a ficar.
        patients_leaving: Os Pacientes estäo indo embora. Melhore seu hospital colocando plantas, bancos, máquinas de bebidas, etc., para os seus visitantes.
        doctors_tired: Os seus Médicos estäo esgotados. Mande-os descansar agora mesmo.
        charges_too_high: Seus preços säo muito altos. Isto significa grandes lucros a curto prazo, mas a longo ficará sem pacientes.
        financial_trouble: Você tem sérios problemas financeiros. Arrume suas finanças já! Se perder outros %d, terá arruinado este nível!
        reception_bottleneck: Há um gargalo na Recepçäo. Contrate outra Recepcionista.
        pay_back_loan: Você tem dinheiro de sobra. Por que näo liquida seu empréstimo?
        nobody_cured_last_month: Ninguém foi curado no mês passado.
        queue_too_long_send_doctor: As filas de %s säo muito longas. Certifique-se de que há um Médico na sala.
        staff_too_hot: Os seus funcionários estäo com muito calor. Baixe a temperatura ou retire alguns Aquecedores das suas salas.
        place_plants2: Os Pacientes estäo indo. Com mais plantas, você conseguiria que ficassem mais tempo.
        doctor_crazy_overwork: Oh, näo! Um dos seus Médicos ficou maluco devido ao excesso de trabalho. Ele irá se recuperar se descansar agora mesmo.
        machinery_damaged: Repare suas máquinas o mais brevemente possível. Näo falta muito para que comecem a cair aos pedaços.
        more_benches: Você poderia colocar mais bancos. Os doentes protestam por terem que ficar em pé.
        bankruptcy_imminent: Ei! Vai ficar sem máquinas. Tome cuidado!
        need_toilets: Os pacientes precisam de banheiros. Coloque-os em um lugar acessível.
        more_toilets: Você precisa de mais Banheiros. As pessoas näo aguentam mais.
        plants_dying: As suas plantas estäo secando. Precisam de água. Consiga mais Zelador para que cuidem disso. Os Pacientes näo gostam das plantas mortas.
        people_did_it_on_the_floor: Alguns dos seus Pacientes näo conseguem mais aguentar. Alguém terá que limpar sem descanso.
        need_staffroom: Construa uma Sala de Descanso para que seus funcionários possam descansar.
        plants_thirsty: Você precisa regar suas plantas. Elas estäo secando.
        too_many_plants: Você tem plantas demais. Isso parece uma selva.
        receptionists_tired2: As suas Recepcionistas estäo esgotadas. Deixe que descansem agora mesmo.
        machine_severely_damaged: '%s está prestes a se quebrar.'
        machinery_very_damaged: É uma emergência! Faça com que um Zelador repare suas máquinas em seguida. Estäo a ponto de explodir!
        hospital_is_rubbish: As pessoas estäo dizendo abertamente que seu hospital é uma porcaria. Você sabe que logo iräo se queixar em outro lugar.
        handymen_tired2: Os seus Zeladores estäo cansados. Mande-os descansar imediatamente.
        machinery_damaged2: Você precisa contratar um Zelador para reparar suas máquinas rapidamente.
        staff_very_cold: O pessoal reclama do frio. Aumente o aquecimento ou coloque mais Aquecedores.
        desperate_need_for_watering: Necessita desesperadamente contratar um Zelador para que cuide das suas plantas.
        staff_unhappy2: Seus funcionários, no geral, estäo descontentes. Logo pediräo mais dinheiro.
      goals:
        lose:
          kill: Mate mais %d pacientes para perder o nível!
        win:
          value: Aumente o valor do seu hospital em %d
          reputation: Aumente a sua reputaçao em %d para satisfazer os critérios de vitória
          cure: Cure mais %d Paciente(s) e terá curado o suficiente para ganhar este nível.
          money: Você precisa de $%d para atender os critérios financeiros deste nível.
      research:
        drug_improved_1: Seu Centro de Pesquisa melhorou o medicamento para %s
        new_drug_researched: Um novo medicamento para curar %s foi descoberto.
        new_machine_researched: Pesquisou com êxito %s.
        drug_fully_researched: Pesquisou 100%% %s.
        drug_improved: O seu Centro de Pesquisa melhorou o medicamento para %s.
        new_available: Já pode utilizar um novo %s.
        machine_improved: O Centro de Pesquisa trouxe melhorias para %s.
        autopsy_discovered_rep_loss: Foi descoberta uma máquina de autópsias. Aguarde uma reaçäo desfavorável das pessoas.
      room_forbidden_non_reachable_parts: Construir a sala neste local resultará em alas do hospital que näo poderäo ser acessadas.
      cheats:
