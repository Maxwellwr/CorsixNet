language: [Deutsch, German, de, ger, deu]
font: cp437
steps:
- inherit: english
- original_strings: 2
- strings:
    diseases:
      broken_wind:
        cure: ' Therapie: Eine spezielle Mixtur aus der Pharma-Theke sorgt für Windstille.'
      corrugated_ankles:
        cure: 'Therapie: Eine Schwester verabreicht dem Patienten ein leicht toxisches Gebräu, welches das Bein wieder strafft.'
    fax:
      vip_visit_query:
        vip_name: '%s hat den Wunsch geäußert, Ihr Krankenhaus besuchen zu wollen.'
        choices:
          invite: Lassen Sie dem V.I.P. eine offizielle Einladung zukommen.
          refuse: Speisen Sie den V.I.P. mit einer Entschuldigung ab.
      vip_visit_result:
        vip_remarked_name: '%s hat Ihr Krankenhaus besucht.'
        cash_grant: Ihnen wurde ein Geldbonus von %d gewährt.
        rep_boost: Ihr Ruf in der Öffentlichkeit hat sich gebessert.
        rep_loss: Ihr Ruf hat gelitten.
        close_text: Danke, dass Sie unser Krankenhaus besucht haben.
        remarks:
          free_build:
          - Echt ein hübsches Krankenhaus haben Sie da! War aber wohl nicht so schwer zum Laufen zu bekommen, so ohne finanzielle Beschränkungen, was? Haha ...
          - Ich bin zwar kein BWLer, aber ich denke, dieses Krankenhaus könnte ich auch führen. Sie wissen schon, was ich meine.
          - Ein gut organisiertes Krankenhaus. Aber hüten Sie sich vor der Finanzkrise! Ach ja ... da müssen Sie sich ja keine Sorgen machen.
      emergency:
        choices:
          accept: Ja, ich übernehme diesen Notfall!
          refuse: Nein, ich weigere mich diesen Notfall zu übernehmen!
        location: Wir haben einen Notruf aus dem %s erhalten.
        num_disease: Es handelt sich um %d Personen mit %s, die sofort behandelt werden müssen.
        num_disease_singular: Hier ist eine Person mit %s, sie braucht sofortige Aufmerksamkeit.
        cure_possible: Wir können diesen Notfall übernehmen.
        cure_not_possible_build_and_employ: Um den Notfall übernehmen zu können, müssen wir eine %s bauen und zusätzliches Personal einstellen.
        cure_not_possible_build: Um den Notfall übernehmen zu können, müssen wir eine %s bauen.
        cure_not_possible_employ: Um den Notfall übernehmen zu können, müssen wir zusätzliches Personal einstellen.
        cure_not_possible: Wir können diesen Notfall im Moment keinesfalls übernehmen.
        bonus: Wenn wir keinen Patienten verlieren, erhalten wir einen Geldbonus von maximal %d. Sollten wir es jedoch vermasseln, wird unser Ruf Schaden nehmen.
        free_build: Wenn wir erfolgreich sind, wird unser Ruf steigen. Falls wir versagen, wird unser Ruf Schaden nehmen.
      emergency_result:
        close_text: Danke, ich habe gerne geholfen.
        earned_money: Sie erhalten von maximal %d einen Geldbonus von %d.
        saved_people: Vielen Dank für Ihre Hilfe! Sie haben %d von insgesamt %d gerettet.
      disease_discovered_patient_choice:
        choices:
          send_home: Schicken Sie den Patienten nach Hause.
          wait: Sorgen Sie dafür, dass der Patient eine Weile im Krankenhaus wartet.
          research: Schicken Sie den Patienten in die Forschungsabteilung.
        need_to_build_and_employ: Um diese Krankheit heilen zu können, müssen wir eine %s bauen und zusätzliches Personal einstellen.
        need_to_build: Um diese Krankheit heilen zu können, müssen wir eine %s bauen.
        need_to_employ: Um diese Krankheit heilen zu können, müssen wir zusätzliches Personal einstellen.
        can_not_cure: Im Moment können wir diese Krankheit nicht behandeln.
        disease_name: Unser Ärzteteam hat herausgefunden, an was für einer Art von %s der Patient leidet.
        what_to_do_question: Was sollen wir jetzt mit dem Patienten anstellen?
        guessed_percentage_name: Unser Ärzteteam ist sich zu %d Prozent sicher, dass der Patient an einer Form von %s leidet.
      disease_discovered:
        close_text: Eine neue Krankheit wurde entdeckt.
        can_cure: Wir können diese Krankheit problemlos behandeln.
        need_to_build_and_employ: Um diese Krankheit heilen zu können, müssen wir eine %s bauen und zusätzliches Personal einstellen.
        need_to_build: Um diese Krankheit heilen zu können, müssen wir eine %s bauen.
        need_to_employ: Um diese Krankheit heilen zu können, müssen wir zusätzliches Personal einstellen.
        discovered_name: Unser Ärzteteam hat einen Fall von %s entdeckt.
      diagnosis_failed:
        choices:
          send_home: Schicken Sie den Patienten nach Hause.
          take_chance: Nehmen Sie die wahrscheinliche Möglichkeit zur Heilung wahr.
          wait: Der Patient soll eine Weile im Krankenhaus warten, wir stellen bald neue Diagnosearten zur Verfügung.
        situation: Dieser Patient hat all unsere Diagnosegeräte zum qualmen gebracht. Trotzdem wissen wir immer noch nicht genau, was ihm fehlt.
        what_to_do_question: Was sollen wir jetzt mit dem Patienten anstellen?
        partial_diagnosis_percentage_name: Unser Ärzteteam ist sich zu %d Prozent sicher, dass der Patient an einer Form von %s leidet.
      epidemic:
        choices:
          declare: Wir melden die Epidemie und zahlen die Geldstrafe!
          cover_up: Wir versuchen die Epidemie einzudämmen bevor sie das Krankenhaus verlässt!
        declare_explanation_fine: Wenn wir die Epidemie melden, zahlen wir eine Strafe von %d und unser Ruf leidet. Dafür werden die Patienten automatisch geimpft.
        cover_up_explanation_1: Wenn wir versuchen, die Epidemie zu vertuschen, müssen wir die Infizierten heilen, bevor das Gesundheitsministerium davon Wind bekommt.
        cover_up_explanation_2: Wenn der Gesundheitsinspektor die Vertuschungsaktion bemerkt, wird das Konsequenzen haben.
        disease_name: Unser Ärzteteam hat eine hochgradig ansteckende Form von %s entdeckt!
      epidemic_result:
        close_text: Hurra!
        failed:
          part_1_name: Ihr Versuch diese %s-Epidemie zu vertuschen ist fehlgeschlagen! Sie konnten nicht verhindern,
          part_2: dass sich die Epidemie in Ihrem ganzen Krankenhaus ausbreitet.
        succeeded:
          part_1_name: Dem Gesundheitsinspektor ist zu Ohren gekommen, dass Sie mit einem schweren Fall von %s zu kämpfen haben.
          part_2: Allerdings hat er dafür keine Beweise finden können.
        compensation_amount: Die Behörden haben beschlossen, Sie für die entstandene Rufschädigung mit %d zu entschädigen.
        fine_amount: Die Behörden haben den nationalen Notstand ausgerufen und sie zu einer Geldstrafe von %d verurteilt.
        rep_loss_fine_amount: Die Zeitungen haben Wind von der Epidemie bekommen und ziehen Ihren Ruf in den Dreck. Darüber hinaus hat man zu einer Geldstrafe von %d verurteilt.
        hospital_evacuated: Die Behörden haben keine andere Wahl, als Ihr Krankenhaus zu evakuieren.
      choices:
        return_to_main_menu: Ins Hauptmenü zurückkehren
        accept_new_level: Zum nächsten Level wechseln
        decline_new_level: Noch ein wenig im aktuellen Level weiterspielen
    dynamic_info:
      patient:
        actions:
          dying: Ins Jenseits befördert!
          epidemic_vaccinated: Ich bin nicht mehr ansteckend
          no_gp_available: Wartet darauf, dass Sie eine Allgemeinmedizin bauen
      staff:
        actions:
          heading_for: 'Geht zu: %s'
          fired: Gefeuert
          vaccine: Impft einen Patienten
      object:
        strength_extra_info: Stärke %d (Regenerierbar zu %d)
    adviser:
      research:
        drug_fully_researched: Sie haben die Effektivität Ihres %s-Medikaments auf 100% gesteigert.
        drug_improved: Die Effektivität Ihres %s-Medikaments wurde von Ihrer Forschungsabteilung verbessert.
        drug_improved_1: Die Effektivität Ihres %s-Medikaments wurde von Ihrer Forschungsabteilung verbessert.
      room_forbidden_non_reachable_parts: Sie können den Raum hier nicht bauen, da dann Teile des Krankenhauses nicht mehr erreichbar wären.
      warnings:
        no_desk: Sie sollten beizeiten mal eine Rezeption bauen und eine Empfangsdame einstellen!
        no_desk_1: Wenn Sie wollen, dass Patienten in Ihr Krankenhaus kommen, müssen Sie eine Empfangsdame einstellen und eine Rezeption für sie bauen!
        no_desk_2: 'Na Klasse, das muss ja ein Weltrekord sein: Fast ein Jahr ohne einen einzigen Patienten! Wenn Sie dieses Krankenhaus weiter leiten wollen, müssen Sie eine Empfangsdame einstellen und eine Rezeption bauen!'
        no_desk_3: Ich glaub ich spinne, fast ein Jahr ist um und Sie haben keine besetzte Rezeption! Wie denken Sie denn, dass die Patienten zu Ihnen finden? Schauen Sie mal zu, dass Sie Ihren Kram auf die Reihe bekommen!
        no_desk_4: Eine Empfangsdame muss ihren eigenen Arbeitsplatz haben, um die Patienten bei ihrer Ankunft zu begrüßen.
        no_desk_5: Na, das wurde aber auch Zeit! Sie sollten in Kürze ein paar Patienten hier eintreffen sehen!
        no_desk_6: Sie haben eine Empfangsdame, also sollten Sie eine Rezeption für sie bauen.
        no_desk_7: Sie haben die Rezeption gebaut, also wie wäre es damit, eine Empfangsdame einzustellen? Sie werden keine Patienten sehen, bis sie das geregelt haben, wissen Sie?
        another_desk: Sie müssen einen weitere Rezeption für die neue Empfangsdame bauen.
        cannot_afford: Sie haben nicht genügend Geld auf dem Konto, um diese Person einzustellen!
        cannot_afford_2: Sie haben nicht genügend Geld auf dem Konto, um dies zu kaufen!
        falling_1: He! Vorsicht mit dem Mauszeiger, jemand könnte sich verletzen!
        falling_2: Hören Sie schon auf damit, wie würde das Ihnen denn gefallen?
        falling_3: Autsch, das sah schmerzhaft aus. Ruft einen Arzt!
        falling_4: Dies ist ein Krankenhaus, kein Vergnügungspark!
        falling_5: Sie sind nicht hier um Leute umzustoßen. Sie sind krank, okay?
        falling_6: Dies ist keine Bowlingbahn. Patienten sollten nicht so behandelt werden!
        research_screen_open_1: Sie müssen eine Forschungseinrichtung errichten, um auf das Forschungsmenü zugreifen zu können.
        research_screen_open_2: Forschung ist im aktuellen Level nicht verfügbar.
        researcher_needs_desk_1: Ein Forscher braucht einen Schreibtisch, um daran arbeiten zu können.
        researcher_needs_desk_2: Ihr Forscher ist froh darüber, dass Sie ihm eine Pause gegönnt haben. Falls Sie vorhatten, dass noch mehr Personal forscht, dann müssen Sie jedem Forscher einen eigenen Schreibtisch zur Verfügung stellen.
        researcher_needs_desk_3: Jeder Forscher braucht einen eigenen Schreibtisch, an dem er arbeiten kann.
        nurse_needs_desk_1: Jede Krankenschwester braucht ihren eignen Schreibtisch, an dem sie arbeiten kann.
        nurse_needs_desk_2: Ihre Krankenschwester ist froh darüber, dass Sie ihr eine Pause gegönnt haben. Falls Sie vorhatten, dass mehr als nur eine Krankenschwester in der Station arbeitet, dann müssen Sie jeder Krankenschwester einen eigenen Schreibtisch zur Verfügung stellen.
        low_prices: Sie berechnen zu wenig für %s. Dadurch bekommen Sie viele Patienten, verdienen aber wenig an jedem einzelnen von ihnen.
        high_prices: Sie berechnen zu viel für %s. Dadurch verdienen Sie kurzfristig viel Geld, aber langfristig vertreiben Sie die damit Patienten aus ihrem Krankenhaus.
        fair_prices: Die Behandlungskosten für %s sind fair und angemessen.
        patient_not_paying: Ein Patient ist gegangen ohne für %s zu bezahlen weil es zu teuer ist!
      cheats:
        th_cheat: Gratulation, Sie haben die Cheats aktiviert!
        roujin_on_cheat: Roujins Herausforderungs-Cheat aktiviert! Viel Glück ...
        roujin_off_cheat: Roujins Herausforderung deaktiviert.
